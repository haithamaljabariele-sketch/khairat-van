<style>
:root{
  --primary:#1D6B58;--primaryDark:#14503F;--primarySoft:#E2EFEA;--bg:#F3F6F5;--surface:#FFFFFF;--text:#16201D;
  --muted:#5D6B66;--line:#DDE4E1;--ok:#2F7D4F;--okSoft:#E3F1E8;--warn:#A86A12;--warnSoft:#F7EEDB;--bad:#B4372F;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-text-size-adjust:100%;overscroll-behavior:none}

button,input,select,textarea{font-family:inherit}

.bar{display:flex;align-items:center;background:var(--primary);color:#fff;min-height:56px;flex:none;

.bar .back{background:none;border:0;color:#fff;font-size:24px;font-weight:700;padding:0 10px 0 12px;min-height:44px;cursor:pointer;line-height:1}
.bar-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.body{max-width:640px;margin:0 auto;padding-left:calc(14px + env(safe-area-inset-left))!important;padding-right:calc(14px + env(safe-area-inset-right))!important}
.footer{flex:none;background:var(--surface);padding:6px calc(14px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));box-shadow:0 -1px 0 var(--line)}

.vbox{display:flex;flex-direction:column;min-width:0}
.hbox{display:flex;flex-direction:row;align-items:center;min-width:0}
.w1{flex:1 1 0;min-width:0}
.t{overflow-wrap:anywhere;line-height:1.35;min-width:0}

/* dialogs */
.dlg-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.dlg{background:var(--surface);border-radius:18px;width:min(100%,440px);max-height:100%;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.25);overflow:hidden}

.dlg-b{display:flex;align-items:center;gap:4px;padding:8px 12px 12px;flex-wrap:wrap}
.dlg-b .sp{flex:1}
.dlg-btn{background:none;border:0;color:var(--primary);font-weight:700;font-size:calc(16px*var(--s));padding:12px 14px;border-radius:10px;cursor:pointer;min-height:46px}
.dlg-btn:active{background:var(--primarySoft)}
.list-it{padding:14px 8px;border-bottom:1px solid var(--line);cursor:pointer;font-size:calc(16px*var(--s));overflow-wrap:anywhere;white-space:pre-line}
.list-it:active{background:var(--primarySoft)}
.slipwrap{background:#e9ecea;border-radius:10px;padding:8px;margin-bottom:8px;max-height:46vh;overflow:auto;text-align:center}
.slipimg{width:100%;max-width:384px;background:#fff;display:inline-block;box-shadow:0 1px 4px rgba(0,0,0,.15)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;
  padding:10px 16px;border-radius:22px;font-size:14px;max-width:86vw;text-align:center;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;line-height:1.45}
#toast.on{opacity:1}
.pickin{position:fixed;left:-1000px;top:0;width:1px;height:1px;opacity:0}
#print-area{display:none}

  @page{margin:4mm}
  html,body{height:auto;overflow:visible;background:#fff}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block}
  #print-img{width:var(--paper);display:block}
}

<script>
'use strict';
/* =====================================================================
   كاش فان — نسخة الويب (للآيفون). The same app as the Android CashVan 2.1:
   same screens, same words, same rules. Everything is saved on the phone
   first (IndexedDB) and sent to the database when there is signal.
   ===================================================================== */

// ------------------------------------------------------------------ Config
const Config = {
  URL: 'https://vyrgrxebuugqccqhgcjf.supabase.co',
  KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ5cmdyeGVidXVncWNjcWhnY2pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5NzI1NzEsImV4cCI6MjEwNzU0ODU3MX0.eWqSC6jE0-lRiemgaCjso2_J_PjlX41jcxfk_Cyxeoc',
  VERSION: '2.3',
  COMPANY: 'شركة خيرات العز للدواجن والمجمدات',
  TAGLINE: 'لتجارة وتوزيع الدجاج الطازج والمجمد',
  OFFICE_PHONE: '0793056660'
};

/** The app's colours: the same green family as the dashboard. */
const C = {
  primary: '#1D6B58', primaryDark: '#14503F', primarySoft: '#E2EFEA', bg: '#F3F6F5', surface: '#FFFFFF',
  text: '#16201D', muted: '#5D6B66', line: '#DDE4E1', ok: '#2F7D4F', okSoft: '#E3F1E8', warn: '#A86A12',
  warnSoft: '#F7EEDB', bad: '#B4372F', badSoft: '#F8E5E3', van2: '#A2621A', blue: '#2563A8', blueSoft: '#E3EDF8',
  purple: '#6B4FA0', purpleSoft: '#EEE8F6', white: '#FFFFFF', transparent: 'transparent'
};

const $ = s => document.querySelector(s);
function num(v, d = 0) { const n = Number(v); return (v === null || v === undefined || v === '' || !isFinite(n)) ? d : n; }
function str(j, k) { if (!j) return ''; const v = j[k]; return (v === null || v === undefined) ? '' : String(v); }
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v === undefined || v === null) continue;
    if (k === 'style') Object.assign(e.style, v);
    else if (k === 'class') e.className = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (k === 'text') e.textContent = v;
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}

// ------------------------------------------------------------------ Fmt
/** Numbers and dates, always with Latin digits so receipts and the office agree. */
const p2 = n => String(n).padStart(2, '0');
const Fmt = {
  round2(v) { v = Number(v); return isFinite(v) ? Math.round(v * 100) / 100 + 0 : 0; },
  round3(v) { v = Number(v); return isFinite(v) ? Math.round(v * 1000) / 1000 + 0 : 0; },
  money(v) { return Fmt.round2(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); },
  money3(v) { return Fmt.round3(v).toFixed(3); },
  plainMoney(v) { return Fmt.round2(v).toFixed(2); },
  kg(v) {
    const r = Fmt.round3(v);
    if (Math.abs(r - Math.round(r)) < 0.0005) return String(Math.round(r) + 0);
    return r.toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
  },
  /** "12.5", "12,5" and Arabic digits all read as 12.5; empty or junk is null. */
  parse(s) {
    if (s === null || s === undefined) return null;
    let b = '';
    for (const ch of String(s).trim()) {
      const c = ch.charCodeAt(0);
      if (c >= 0x660 && c <= 0x669) b += String(c - 0x660);
      else if (c >= 0x6F0 && c <= 0x6F9) b += String(c - 0x6F0);
      else if (ch === ',' || ch === '٫') b += '.';
      else if ((ch >= '0' && ch <= '9') || ch === '.' || ch === '-') b += ch;
    }
    if (!/^-?(\d+\.?\d*|\.\d+)$/.test(b)) return null;
    return Number(b);
  },
  ymd(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); },
  today() { return Fmt.ymd(new Date()); },
  now() {
    const d = new Date(); const off = -d.getTimezoneOffset(); const a = Math.abs(off);
    return Fmt.ymd(d) + 'T' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()) + (off >= 0 ? '+' : '-') + p2(Math.floor(a / 60)) + p2(a % 60);
  },
  time() { const d = new Date(); return p2(d.getHours()) + ':' + p2(d.getMinutes()); },
  stamp() { return Fmt.today() + ' ' + Fmt.time(); },
  parseDay(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(NaN); },
  daysBack(day, n) { const d = Fmt.parseDay(day); if (isNaN(d)) return Fmt.today(); d.setDate(d.getDate() - n); return Fmt.ymd(d); },
  /** 2026-10-19 → 19/10/2026 */
  pretty(day) { if (!day || String(day).length < 10) return day || ''; day = String(day); return day.substring(8, 10) + '/' + day.substring(5, 7) + '/' + day.substring(0, 4); },
  dayName(day) {
    try {
      const d = Fmt.parseDay(day); if (isNaN(d)) return day;
      return new Intl.DateTimeFormat('ar', { weekday: 'long' }).format(d) + ' ' + d.getDate() + '/' + (d.getMonth() + 1);
    } catch (e) { return day; }
  },
  uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    const h = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
    return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
  }
};
function toIntOrNull(s) { s = String(s == null ? '' : s).trim(); return /^[-+]?\d+$/.test(s) ? parseInt(s, 10) : null; }

/** A name reduced to what makes it the same name (حموده = حمودة). */
function nameKey(s) {
  let out = '';
  for (const ch of String(s || '').trim().toLowerCase()) {
    switch (ch) {
      case ' ': case '_': case '-': case '.': case '/': case '(': case ')': case ':': case '‏': case '‎': break;
      case 'أ': case 'إ': case 'آ': case 'ٱ': out += 'ا'; break;
      case 'ة': out += 'ه'; break;
      case 'ى': out += 'ي'; break;
      default: { const c = ch.charCodeAt(0); if (c < 0x064B || c > 0x0652) out += ch; }
    }
  }
  return out;
}

// ------------------------------------------------------------------ Api
class ApiError extends Error {
  constructor(message, o = {}) { super(message); this.sessionEnded = !!o.sessionEnded; this.network = !!o.network; this.maintenance = !!o.maintenance; }
}
/** Calls the database functions (POST /rest/v1/rpc/<name>). */
const Api = {
  async call(fn, args, timeoutMs = 45000) {
    const ctrl = window.AbortController ? new AbortController() : null;
    const timer = setTimeout(() => ctrl && ctrl.abort(), timeoutMs);
    let res, body;
    try {
      res = await fetch(Config.URL + '/rest/v1/rpc/' + fn, {
        method: 'POST', cache: 'no-store', signal: ctrl ? ctrl.signal : undefined,
        headers: { 'apikey': Config.KEY, 'Authorization': 'Bearer ' + Config.KEY, 'Content-Type': 'application/json; charset=utf-8', 'Accept': 'application/json' },
        body: JSON.stringify(args)
      });
      body = await res.text();
    } catch (e) {
      throw new ApiError('لا يوجد اتصال بالإنترنت', { network: true });
    } finally { clearTimeout(timer); }
    if (!res.ok) {
      let msg; try { const j = JSON.parse(body); msg = (j && j.message != null) ? String(j.message) : body; } catch (e) { msg = body; }
      const ended = msg.includes('SESSION_ENDED');
      const maint = msg.includes('MAINTENANCE');   // the office paused the apps: keep the document, try later
      msg = msg.replace('SESSION_ENDED: ', '').replace('MAINTENANCE: ', '');
      throw new ApiError(msg.trim() ? msg : 'خطأ من الخادم (' + res.status + ')', { sessionEnded: ended, maintenance: maint });
    }
    if (!body.trim() || body === 'null') return null;
    return JSON.parse(body);
  },
  async obj(fn, args, t) { const r = await Api.call(fn, args, t); return (r && typeof r === 'object' && !Array.isArray(r)) ? r : {}; },
  async arr(fn, args) { const r = await Api.call(fn, args); return Array.isArray(r) ? r : []; }
};
function errText(e) { return (e && e.message) || 'خطأ'; }

// ------------------------------------------------------------------ Store (IndexedDB, kept in memory too)
/**
 * What the phone keeps:
 *  - outbox: every sale, voucher, purchase, transfer, count, expense and deposit,
 *    written here FIRST and sent when there is signal. Sent rows stay for lists and reprinting.
 *  - photos (+ blobs): pictures waiting to go up.
 *  - numbers: invoice / voucher numbers handed out by the office in advance.
 *  - kv: the office data and the last day summary.
 */
const Store = {
  PENDING: 0, SENT: 1, FAILED: 2, DRAFT: 3,
  db: null, kvm: new Map(), outm: new Map(), phm: new Map(), numm: new Map(), _t: 0,
  open() {
    return new Promise(res => {
      let req;
      try { req = indexedDB.open('cashvan2', 1); } catch (e) { res(); return; }
      req.onupgradeneeded = () => {
        const db = req.result;
        db.createObjectStore('kv', { keyPath: 'k' }); db.createObjectStore('outbox', { keyPath: 'id' });
        db.createObjectStore('photos', { keyPath: 'id' }); db.createObjectStore('blobs', { keyPath: 'id' });
        db.createObjectStore('numbers', { keyPath: 'num' });
      };
      req.onsuccess = async () => { Store.db = req.result; try { await Store._load(); } catch (e) { console.error(e); } res(); };
      req.onerror = () => res();
    });
  },
  _all(name) { return new Promise((res, rej) => { const r = Store.db.transaction(name).objectStore(name).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }); },
  async _load() {
    for (const x of await Store._all('kv')) Store.kvm.set(x.k, x.v);
    for (const x of await Store._all('outbox')) { Store.outm.set(x.id, x); Store._t = Math.max(Store._t, x.created_at || 0); }
    for (const x of await Store._all('photos')) { Store.phm.set(x.id, x); Store._t = Math.max(Store._t, x.created_at || 0); }
    for (const x of await Store._all('numbers')) Store.numm.set(x.num, x);
  },
  /** one write transaction; op(tx) queues the puts/deletes */
  _w(names, op) {
    if (!Store.db) return Promise.resolve();
    return new Promise((res, rej) => {
      let t; try { t = Store.db.transaction(names, 'readwrite'); } catch (e) { rej(e); return; }
      t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('abort'));
      op(t);
    });
  },
  _get(name, key) {
    if (!Store.db) return Promise.resolve(Store._mem && Store._mem.get(key));
    return new Promise((res, rej) => { const r = Store.db.transaction(name).objectStore(name).get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  },
  stamp() { Store._t = Math.max(Store._t + 1, Date.now()); return Store._t; },

  // kv
  kv(k) { const v = Store.kvm.get(k); return v === undefined ? null : v; },
  setKv(k, v) {
    if (v === null || v === undefined) { Store.kvm.delete(k); return Store._w('kv', t => t.objectStore('kv').delete(k)); }
    Store.kvm.set(k, v); return Store._w('kv', t => t.objectStore('kv').put({ k, v }));
  },

  // outbox
  add(kind, id, day, title, amount, payload) {
    const o = { id, kind, day, title: title || '', amount: num(amount), payload, status: 0, error: null, created_at: Store.stamp(), sent_at: null };
    Store.outm.set(id, o);
    return Store._w('outbox', t => t.objectStore('outbox').put(o));
  },
  _outs(f) { return [...Store.outm.values()].filter(f).sort((a, b) => a.created_at - b.created_at); },
  pending() { return Store._outs(o => o.status === 0); },
  failed() { return Store._outs(o => o.status === 2); },
  ofDay(day, kind) { return Store._outs(o => o.day === day && (!kind || o.kind === kind)); },
  out(id) { return Store.outm.get(id) || null; },
  unsentCount() { let n = 0; for (const o of Store.outm.values()) if (o.status !== 1) n++; return n; },
  _put(o) { return Store._w('outbox', t => t.objectStore('outbox').put(o)); },
  markSent(id) { const o = Store.outm.get(id); if (!o) return; o.status = 1; o.error = null; o.sent_at = Date.now(); return Store._put(o); },
  markFailed(id, err) { const o = Store.outm.get(id); if (!o) return; o.status = 2; o.error = err; return Store._put(o); },
  retry(id) { const o = Store.outm.get(id); if (!o) return; o.status = 0; o.error = null; return Store._put(o); },
  discard(id) { const o = Store.outm.get(id); if (!o || o.status === 1) return; Store.outm.delete(id); return Store._w('outbox', t => t.objectStore('outbox').delete(id)); },
  updatePayload(id, p) { const o = Store.outm.get(id); if (!o) return; o.payload = p; return Store._put(o); },
  /** Old sent rows are only kept for a while — the database has them. */
  prune(keepDays = 40) {
    const cut = Date.now() - keepDays * 86400000;
    const outs = [...Store.outm.values()].filter(o => o.status === 1 && o.created_at < cut);
    const phs = [...Store.phm.values()].filter(p => p.status === 1 && p.created_at < cut);
    if (!outs.length && !phs.length) return Promise.resolve();
    outs.forEach(o => Store.outm.delete(o.id)); phs.forEach(p => Store.phm.delete(p.id));
    return Store._w(['outbox', 'photos', 'blobs'], t => {
      outs.forEach(o => t.objectStore('outbox').delete(o.id));
      phs.forEach(p => { t.objectStore('photos').delete(p.id); t.objectStore('blobs').delete(p.id); });
    });
  },

  // photos
  addPhoto(id, kind, refId, day, data, mime, title, status = 0) {
    const p = { id, kind, ref_id: refId, day, mime, title: title || '', status, error: null, created_at: Store.stamp() };
    Store.phm.set(id, p);
    if (!Store.db) { (Store._mem = Store._mem || new Map()).set(id, { id, data, mime }); return Promise.resolve(); }
    return Store._w(['photos', 'blobs'], t => { t.objectStore('blobs').put({ id, data, mime }); t.objectStore('photos').put(p); });
  },
  _photos(f) { return [...Store.phm.values()].filter(f).sort((a, b) => a.created_at - b.created_at); },
  pendingPhotos() { return Store._photos(p => p.status === 0 || p.status === 2); },
  /** a picture taken on a form becomes sendable only when the form is saved */
  commitPhotos(ref) {
    const l = Store._photos(p => p.ref_id === ref && p.status === 3);
    l.forEach(p => { p.status = 0; });
    return Store._w('photos', t => l.forEach(p => t.objectStore('photos').put(p)));
  },
  photosFor(kind, ref) { return Store._photos(p => p.kind === kind && p.ref_id === ref); },
  hasPhoto(kind, ref) { return Store.photosFor(kind, ref).length > 0; },
  dropPhotos(ref) {
    const l = Store._photos(p => p.ref_id === ref && p.status !== 1);
    l.forEach(p => Store.phm.delete(p.id));
    return Store._w(['photos', 'blobs'], t => l.forEach(p => { t.objectStore('photos').delete(p.id); t.objectStore('blobs').delete(p.id); }));
  },
  dropPhoto(id) { Store.phm.delete(id); return Store._w(['photos', 'blobs'], t => { t.objectStore('photos').delete(id); t.objectStore('blobs').delete(id); }); },
  markPhoto(id, status, err = null) {
    const p = Store.phm.get(id); if (!p) return;
    p.status = status; p.error = err;
    return Store._w(['photos', 'blobs'], t => { t.objectStore('photos').put(p); if (status === 1) t.objectStore('blobs').delete(id); });
  },
  photoData(id) { return Store._get('blobs', id); },
  /** drafts belong to a form that is open; when the app starts, no form is open */
  purgeDrafts() { const l = Store._photos(p => p.status === 3); l.forEach(p => Store.phm.delete(p.id)); if (!l.length) return; return Store._w(['photos', 'blobs'], t => l.forEach(p => { t.objectStore('photos').delete(p.id); t.objectStore('blobs').delete(p.id); })); },

  // numbers
  addNumbers(kind, nums) {
    const add = [];
    for (const n of nums) {
      if (Store.numm.has(n)) continue;
      const seq = toIntOrNull(String(n).split('-').pop()) || 0;
      const r = { num: n, kind, seq, used: 0 }; Store.numm.set(n, r); add.push(r);
    }
    return Store._w('numbers', t => add.forEach(r => t.objectStore('numbers').put(r)));
  },
  freeNumbers(kind) { let n = 0; for (const r of Store.numm.values()) if (r.kind === kind && !r.used) n++; return n; },
  /** The lowest unused number, marked used at once. Null when the pool is empty. */
  takeNumber(kind) {
    let best = null;
    for (const r of Store.numm.values()) if (r.kind === kind && !r.used && (!best || r.seq < best.seq)) best = r;
    if (!best) return null;
    best.used = 1;
    Store._w('numbers', t => t.objectStore('numbers').put(best)).catch(() => {});
    return best.num;
  },
  clearAll() {
    Store.kvm.clear(); Store.outm.clear(); Store.phm.clear(); Store.numm.clear();
    return Store._w(['kv', 'outbox', 'photos', 'blobs', 'numbers'], t => ['kv', 'outbox', 'photos', 'blobs', 'numbers'].forEach(n => t.objectStore(n).clear()));
  }
};

// ------------------------------------------------------------------ Prefs (this phone's own settings)
const Prefs = {
  _o: {},
  load() { try { this._o = JSON.parse(localStorage.getItem('cv2') || '{}') || {}; } catch (e) { this._o = {}; } },
  _save() { try { localStorage.setItem('cv2', JSON.stringify(this._o)); } catch (e) {} },
  _g(k, d) { return this._o[k] === undefined ? d : this._o[k]; },
  _s(k, v) { this._o[k] = v; this._save(); },
  get token() { return this._g('token', ''); }, set token(v) { this._s('token', v); },
  get vanNo() { return this._g('van_no', 0); }, set vanNo(v) { this._s('van_no', v); },
  get vanName() { return this._g('van_name', ''); }, set vanName(v) { this._s('van_name', v); },
  get lastSync() { return this._g('last_sync', 0); }, set lastSync(v) { this._s('last_sync', v); },
  get lastError() { return this._g('last_error', ''); }, set lastError(v) { this._s('last_error', v); },
  get paperMm() { return this._g('paper_mm', 58); }, set paperMm(v) { this._s('paper_mm', v); },
  get paperDots() { return this.paperMm >= 80 ? 576 : 384; },
  get printLogo() { return this._g('print_logo', true); }, set printLogo(v) { this._s('print_logo', v); },
  get reminderHour() { return this._g('reminder_hour', 19); }, set reminderHour(v) { this._s('reminder_hour', v); },
  get bigText() { return this._g('big_text', false); }, set bigText(v) { this._s('big_text', v); },
  /** The last price this phone sold an item at, per customer then per item. */
  lastPrice(customerId, item) {
    const a = this._o['lp_' + customerId + '_' + item] ?? this._o['lp_0_' + item];
    return a === undefined || a === null ? null : Fmt.parse(String(a));
  },
  rememberPrice(customerId, item, price) { this._o['lp_' + customerId + '_' + item] = String(price); this._o['lp_0_' + item] = String(price); this._save(); },
  get signedIn() { return !!this.token && this.vanNo > 0; },
  signOut() { for (const k of ['token', 'van_no', 'van_name', 'last_sync']) delete this._o[k]; this._save(); }
};

// ------------------------------------------------------------------ Master (the office data, as last pulled)
class Master {
  constructor(j) {
    this.j = j || {};
    const van = this.j.van || {};
    this.vanName = str(van, 'name'); this.vanNo = num(van.van_no); this.myPlace = str(van, 'location');
    this.invoicePrefix = str(van, 'invoice_prefix');
    this.today = str(this.j, 'today') || Fmt.today();
    this.photosFrom = str(this.j, 'photos_from');
    this.items = (this.j.items || []).map(it => ({ id: it.id, name: str(it, 'name'), company: str(it, 'company'),
      minPrice: it.min_price == null ? null : num(it.min_price), cost: it.cost == null ? null : num(it.cost) }));
    this.customers = (this.j.customers || []).map(c => ({ id: num(c.id), number: num(c.number), name: str(c, 'name'),
      kind: c.kind == null ? 'ذمم' : String(c.kind), creditLimit: c.credit_limit == null ? null : num(c.credit_limit), phone: str(c, 'phone'),
      balance: num(c.balance), chequesPending: num(c.cheques_pending), totalDue: num(c.total_due), lastSale: str(c, 'last_sale'), lastPayment: str(c, 'last_payment'),
      get cashOnly() { return this.kind === 'نقدي'; } }));
    this.companies = (this.j.companies || []).map(String);
    this.places = (this.j.locations || []).map(p => ({ name: str(p, 'name'), kind: str(p, 'kind'), vanNo: p.van_no == null ? null : num(p.van_no) }));
    this.expenseCategories = (this.j.expense_categories || []).map(String);
    this.cheques = (this.j.cheques_waiting || []).map(c => ({ id: str(c, 'id'), no: str(c, 'cheque_no'), customer: str(c, 'customer_name'),
      amount: num(c.amount), dueOn: str(c, 'due_on'), receivedOn: str(c, 'received_on') }));
    this.settings = this.j.settings || {};
  }
  /** each company's colour from the dashboard (الشركات وألوانها) */
  companyColor(name) { const v = str(this.j.company_colors || {}, name); return /^#[0-9a-fA-F]{3,8}$/.test(v) ? v : null; }
  setting(key) { return str(this.settings, key); }
  allowed(key, def) { const s = this.setting(key); return s === 'نعم' ? true : s === 'لا' ? false : def; }
  intSetting(key, def) { const v = toIntOrNull(this.setting(key)); return v === null ? def : v; }
  customer(id) { return this.customers.find(c => c.id === id) || null; }
  item(name) { return this.items.find(i => i.name === name) || this.items.find(i => nameKey(i.name) === nameKey(name)) || null; }
  static load() {
    const s = Store.kv('pull'); if (!s) return null;
    if (Master._s === s) return Master._m;
    try { Master._m = new Master(JSON.parse(s)); Master._s = s; return Master._m; } catch (e) { return null; }
  }
}

/** The day as the database last told it (sales, bank, stock, missing photos…). */
class DayData {
  constructor(j) { this.j = j || {}; this.day = str(this.j, 'day'); this.bank = (this.j.bank && typeof this.j.bank === 'object') ? this.j.bank : null; this.missing = this.j.missing_photos || {}; }
  arr(k) { const a = this.j[k]; return Array.isArray(a) ? a : []; }
  missingCount() { return ['purchase', 'expense', 'deposit'].reduce((s, k) => s + ((this.missing[k] || []).length), 0); }
  static load(day) { const s = Store.kv('day:' + day); if (!s) return null; try { return new DayData(JSON.parse(s)); } catch (e) { return null; } }
}

// ------------------------------------------------------------------ Summary
/** One line in a day's list, from the phone or from the database. */
function Doc(id, kind, title, sub, amount, local, status, error, json, deleted = false) { return { id, kind, title, sub, amount, local, status, error, json, deleted }; }

/** Today's figures: what the database said at the last sync plus what this phone saved since. */
class Summary {
  constructor(day) {
    this.day = day;
    this.dayData = DayData.load(day);
    /** when today's figures are not on the phone yet (after midnight), the last day known still carries the money outside the bank */
    const last = Store.kv('day:last');
    this.lastData = this.dayData || (last ? DayData.load(last) : null);
    this.outs = Store.ofDay(day);
  }
  docs(kind) {
    const serverKey = { invoice: 'invoices', collection: 'collections', purchase: 'purchases', expense: 'expenses', deposit: 'deposits' }[kind] || '';
    const seen = new Set(); const l = [];
    const delKind = { invoice: 'delete_invoice', collection: 'delete_collection' }[kind];
    const deletedLocal = new Set(this.outs.filter(o => o.kind === delKind).map(o => str(o.payload, 'id')));
    // the latest edit of each document made on this phone (sent or not) wins over what the database last said
    const edits = new Map();
    for (const o of this.outs.filter(o => o.kind === 'edit_' + kind)) edits.set(str(o.payload, 'id'), o);
    const withEdit = d => {
      const e = edits.get(d.id); if (!e) return d;
      return Object.assign(d, { title: e.title, amount: e.amount, sub: Summary.sub(kind, e.payload), json: Object.assign({}, d.json, e.payload), edited: true,
        status: e.status === Store.SENT ? d.status : e.status, error: e.status === Store.FAILED ? e.error : d.error });
    };
    for (const o of this.outs.filter(o => o.kind === kind)) {
      seen.add(o.id);
      l.push(withEdit(Doc(o.id, kind, o.title, Summary.sub(kind, o.payload), o.amount, true, o.status, o.error, o.payload, deletedLocal.has(o.id))));
    }
    const a = this.dayData ? this.dayData.arr(serverKey) : null;
    if (a) for (const j of a) {
      const id = str(j, kind === 'purchase' ? 'batch' : 'id');
      if (seen.has(id)) {
        // the database's copy knows whether it was deleted
        const d = l.find(x => x.id === id);
        if (d && j.deleted === true) d.deleted = true;
        continue;
      }
      if (kind === 'invoice') l.push(withEdit(Doc(id, kind, str(j, 'number') + ' · ' + str(j, 'customer_name'), str(j, 'receipt_type'), num(j.total), false, 1, null, j, j.deleted === true || deletedLocal.has(id))));
      else if (kind === 'collection') l.push(withEdit(Doc(id, kind, (str(j, 'number') ? str(j, 'number') + ' · ' : '') + str(j, 'customer_name'), str(j, 'method'), num(j.amount), false, 1, null, j, j.deleted === true || deletedLocal.has(id))));
      else if (kind === 'purchase') l.push(Doc(id, kind, str(j, 'company'), Fmt.kg(num(j.kg)) + ' كغم · ' + num(j.lines) + ' صنف', num(j.total), false, 1, null, j));
      else if (kind === 'expense') l.push(Doc(id, kind, str(j, 'category'), str(j, 'method'), num(j.amount), false, 1, null, j));
      else l.push(Doc(id, kind, str(j, 'kind') === 'cheque' ? 'إيداع شيكات' : 'إيداع نقدي', str(j, 'bank'), num(j.amount), false, 1, null, j));
    }
    return l;
  }
  static sub(kind, p) {
    switch (kind) {
      case 'invoice': return str(p, 'receipt_type') + ' · ' + str(p, 'time');
      case 'collection': return str(p, 'method');
      case 'purchase': return (p.lines || []).length + ' صنف';
      case 'expense': return str(p, 'method');
      case 'deposit': return str(p, 'bank');
      default: return '';
    }
  }
  has(kind, doc) { return doc.json.has_photo === true || Store.hasPhoto(kind, doc.id); }
  get salesTotal() { return this.docs('invoice').filter(d => !d.deleted).reduce((s, d) => s + d.amount, 0); }
  get salesCount() { return this.docs('invoice').filter(d => !d.deleted).length; }
  get collectedTotal() {
    const col = this.docs('collection').filter(d => !d.deleted);
    // a sale's payment becomes a collection in the database; until then count it from the sale itself
    const inDb = new Set(col.filter(d => !d.local).map(d => str(d.json, 'invoice_number')).filter(s => s));
    const unsentPaid = this.docs('invoice').filter(d => d.local && !d.deleted && !inDb.has(str(d.json, 'number'))).reduce((s, d) => s + num(d.json.paid), 0);
    return col.reduce((s, d) => s + d.amount, 0) + unsentPaid;
  }
  /** Money outside the bank: the database figure, moved by what is not sent yet. */
  get undeposited() {
    let u = num(this.lastData && this.lastData.bank ? this.lastData.bank.undeposited : 0);
    for (const o of Store.pending()) {
      if (o.kind === 'invoice') u += num(o.payload.paid);
      else if (o.kind === 'collection') { if (!str(o.payload, 'method').startsWith('تحويل')) u += num(o.payload.amount); }
      else if (o.kind === 'expense') { if (str(o.payload, 'method') === 'نقدي') u -= num(o.payload.amount); }
      else if (o.kind === 'deposit') u -= num(o.payload.amount);
    }
    return u;
  }
  /** What still needs a picture: from the database's list and from unsent documents. */
  missing() {
    const l = [];
    const m = this.dayData ? this.dayData.missing : null;
    if (m) for (const k of ['purchase', 'expense', 'deposit']) {
      for (const j of (m[k] || [])) { const ref = str(j, 'ref_id'); if (!Store.hasPhoto(k, ref)) l.push(Doc(ref, k, str(j, 'title'), Fmt.pretty(str(j, 'day')), 0, false, 1, null, j)); }
    }
    const ids = new Set(l.map(d => d.id));
    for (const o of [...Store.pending(), ...Store.failed()]) {
      if (!['purchase', 'expense', 'deposit'].includes(o.kind) || ids.has(o.id)) continue;
      if (!Store.hasPhoto(o.kind, o.id)) l.push(Doc(o.id, o.kind, o.title, Fmt.pretty(o.day), o.amount, true, o.status, o.error, o.payload));
    }
    return l;
  }
}

// ------------------------------------------------------------------ Sync
function b64(buf) {
  const bytes = new Uint8Array(buf); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
/**
 * Sends what the phone saved, then brings back the office data.
 * Order matters: documents first, then their pictures, then fresh numbers,
 * then the office's customers / balances / settings and today's summary.
 * One run at a time — two at once is how invoices got duplicated in the past.
 */
const Sync = {
  sessionEnded: false, _chain: Promise.resolve(),
  FN: { invoice: 'app_save_invoice', collection: 'app_save_collection', purchase: 'app_save_purchase', transfer: 'app_save_transfer',
        count: 'app_save_count', expense: 'app_save_expense', deposit: 'app_save_deposit', delete_invoice: 'app_delete_invoice',
        edit_invoice: 'app_update_invoice', edit_collection: 'app_update_collection', delete_collection: 'app_delete_collection' },
  /** resolves to null on success or the message to show; a second caller waits for the run in progress */
  running: 0, PULL_EVERY_MS: 90000,
  busy(on) { Sync.running += on ? 1 : -1; let b = document.getElementById('busy'); if (!b) { b = document.createElement('div'); b.id = 'busy'; document.body.append(b); } b.classList.toggle('on', Sync.running > 0); },
  run(pull = true, force = false) {
    const p = Sync._chain.then(() => Sync._run(pull, force));
    Sync._chain = p.catch(() => {});
    return p.then(err => { Sync.afterRun(); return err; });
  },
  afterRun() {
    if (Sync.sessionEnded && Prefs.signedIn) { Sync.sessionEnded = false; Prefs.signOut(); goLogin(); toast('انتهت الجلسة — سجّل الدخول من جديد', true); }
  },
  async _run(pull, force) {
    // nothing to send and the office data is fresh: come back at once (the home screen opens often)
    if (!force && pull && !Store.pending().length && !Store.pendingPhotos().length
        && Date.now() - (Prefs.lastSync || 0) < Sync.PULL_EVERY_MS && Store.kv('day:last') === Fmt.today()) return null;
    Sync.busy(true);
    try { return await Sync._run0(pull); } finally { Sync.busy(false); }
  },
  async _run0(pull) {
    try {
      if (!Prefs.signedIn) return 'سجّل الدخول أولاً';
      const tok = Prefs.token;
      let sentAny = false, paused = false;   // paused = وضع الصيانة: nothing is sent, everything stays pending
      // 1. documents
      for (const o of Store.pending()) {
        if (paused) break;
        const fn = Sync.FN[o.kind]; if (!fn) continue;
        const cur = Store.out(o.id); if (!cur || cur.status !== 0) continue;
        try {
          if (o.kind === 'delete_invoice' || o.kind === 'delete_collection') await Api.call(fn, { p_token: tok, p_id: str(o.payload, 'id'), p_reason: str(o.payload, 'reason') });
          else await Api.call(fn, { p_token: tok, p: o.payload });
          await Store.markSent(o.id); sentAny = true;
        } catch (e) {
          if (!(e instanceof ApiError)) throw e;
          if (e.sessionEnded) { Sync.sessionEnded = true; return e.message; }
          if (e.maintenance) { paused = true; Prefs.lastError = e.message; continue; }
          if (e.network) { Prefs.lastError = e.message; return e.message; }
          await Store.markFailed(o.id, e.message || 'خطأ');
        }
      }
      // 2. pictures (only once their document is in the database)
      for (const ph of Store.pendingPhotos()) {
        const ref = Store.out(ph.ref_id);
        if (paused) break;
        if (ref && ref.status !== 1) continue;
        const rec = await Store.photoData(ph.id);
        if (!rec || !rec.data) { await Store.markPhoto(ph.id, 2, 'الملف غير موجود'); continue; }
        try {
          const meta = { id: ph.id, kind: ph.kind, ref_id: ph.ref_id, day: ph.day, mime: ph.mime || rec.mime || 'image/jpeg' };
          await Api.call('app_attach', { p_token: tok, p: meta, p_data: b64(rec.data) }, 90000);
          await Store.markPhoto(ph.id, 1);
        } catch (e) {
          if (!(e instanceof ApiError)) throw e;
          if (e.sessionEnded) { Sync.sessionEnded = true; return e.message; }
          if (e.maintenance) { paused = true; continue; }
          if (e.network) return e.message;
          await Store.markPhoto(ph.id, 2, e.message);
        }
      }
      // 3. numbers for the next sales and vouchers
      try {
        if (Store.freeNumbers('invoice') < 15) await Store.addNumbers('invoice', (await Api.arr('app_reserve', { p_token: tok, p_kind: 'invoice', p_count: 30 })).map(String));
        if (Store.freeNumbers('voucher') < 8) await Store.addNumbers('voucher', (await Api.arr('app_reserve', { p_token: tok, p_kind: 'voucher', p_count: 15 })).map(String));
      } catch (e) {
        if (!(e instanceof ApiError)) throw e;
        if (e.sessionEnded) { Sync.sessionEnded = true; return e.message; }
        if (e.network) return e.message;
      }
      // 4. the office data and today's summary
      if (pull) {
        try {
          const m = await Api.obj('app_pull', { p_token: tok });
          await Store.setKv('pull', JSON.stringify(m));
          const day = str(m, 'today') || Fmt.today();
          const d = await Api.obj('app_day', { p_token: tok, p_day: day }, 60000);
          await Store.setKv('day:' + day, JSON.stringify(d));
          await Store.setKv('day:last', day);
        } catch (e) {
          if (!(e instanceof ApiError)) throw e;
          if (e.sessionEnded) Sync.sessionEnded = true;
          return e.message;
        }
      }
      // a quick save sends without the full pull; still refresh today's figures so "غير مودع" stays right
      if (!pull && sentAny) {
        const m = Master.load(); const day = m ? m.today : Fmt.today();
        try { await Sync.fetchDay(day); } catch (e) { if (e instanceof ApiError && e.sessionEnded) { Sync.sessionEnded = true; return e.message; } }
      }
      Prefs.lastSync = Date.now();
      Prefs.lastError = '';
      await Store.prune();
      return null;
    } catch (t) {
      return (t && t.message) || 'خطأ';
    }
  },
  /** One day's summary from the database (lists, bank, stock). */
  async fetchDay(day) {
    const d = await Api.obj('app_day', { p_token: Prefs.token, p_day: day }, 60000);
    await Store.setKv('day:' + day, JSON.stringify(d));

// ------------------------------------------------------------------ dialogs (the phone's back closes the top one)
const Dlg = {
  stack: [],
  /** o: {title, content (node|string), buttons:[{label, role:'pos'|'neg'|'neu', click(d), keep}], cancelable, onClose} */
  show(o) {
    const d = { cancelable: o.cancelable !== false, onClose: o.onClose || null, closing: false, then: null };
    const ov = el('div', { class: 'dlg-ov' }); const box = el('div', { class: 'dlg', role: 'dialog' });

    box.append(cont);
    const bs = o.buttons || [];

      const bar = el('div', { class: 'dlg-b' });
      const mk = b => { const e = el('button', { class: 'dlg-btn', type: 'button' }, b.label); e.onclick = () => {

      bar.append(el('div', { class: 'sp' }));
      bs.filter(b => b.role === 'neg').forEach(b => bar.append(mk(b)));
      bs.filter(b => b.role === 'pos').forEach(b => bar.append(mk(b)));
      box.append(bar);
    }
    ov.append(box);
    ov.addEventListener('click', e => { if (e.target === ov && d.cancelable && !d.closing) Dlg.close(d, null); });
    d.ov = ov; d.box = box; d.content = cont;
    Dlg.stack.push(d);

    try { history.pushState({ d: Nav.curDepth, dlg: Dlg.stack.length }, '', location.href); d.pushed = true; } catch (e) { d.pushed = false; }
    return d;
  },
  /** closes [d]; [then] runs once it is gone (after the history entry is popped) */
  close(d, then) {

/** A searchable list. syncPick runs inside the tap itself (needed to open the camera); return true to skip onPick. */

  const box = ui.vbox();

  const list = ui.vbox();

    list.innerHTML = '';

// ------------------------------------------------------------------ navigation (hash routes; back = the app's back)
const Nav = {
  curHash: null, curDepth: 0, onLeave: null, tok: 0,
  depth() { return (history.state && history.state.d) || 0; },
  go(route) { Nav._leave(); history.pushState({ d: Nav.curDepth + 1 }, '', '#' + route); Nav.render(); },
  replace(route, d = 0) { Nav._leave(); history.replaceState({ d }, '', '#' + route); Nav.render(); },
  /** like Activity.finish(): back to the screen that opened this one */

  _leave() { const f = Nav.onLeave; Nav.onLeave = null; if (f) try { f(); } catch (e) { console.error(e); } },
  onPop() {
    if (location.hash === Nav.curHash && Nav.depth() === Nav.curDepth) return;   // a dialog's entry, already handled
    Nav._leave(); Nav.render();
  },
  live(tok) { return tok === Nav.tok; },
  render() {
    Dlg.clearAll();
    const h = (location.hash || '#/home').slice(1);
    const [path, qs] = h.split('?');
    const params = new URLSearchParams(qs || '');
    const parts = path.split('/').filter(Boolean);
    let name = parts[0] || 'home';
    if (!Prefs.signedIn && name !== 'login') { history.replaceState({ d: 0 }, '', '#/login'); name = 'login'; }
    else if (Prefs.signedIn && name === 'login') { history.replaceState({ d: 0 }, '', '#/home'); name = 'home'; }
    Nav.curHash = location.hash; Nav.curDepth = Nav.depth(); Nav.tok++;
    const fn = Screens[name] || Screens.home;

  }

// ------------------------------------------------------------------ photos
function isWebKit() {
  const ua = navigator.userAgent;
  return /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) || (/Safari/.test(ua) && !/Chrome|Chromium|CriOS|Android|Edg/.test(ua));
}

}

 * Shrinks a camera picture to ~1200 px on its long side, JPEG quality 70 — still
 * sharp enough to read a receipt, about 150 KB instead of 4 MB.
 */
async function shrinkPhoto(file) {
  const MAX = 1200; let src = null, w = 0, h = 0, done = () => {};
  if (!isWebKit() && window.createImageBitmap) {
    try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); w = src.width; h = src.height; done = () => src.close && src.close(); } catch (e) { src = null; }
  }
  if (!src) {   // Safari/iPhone: an <img> already applies the picture's rotation (EXIF)

    const img = new Image();
    try { await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('الملف ليس صورة')); img.src = url; }); }
    catch (e) { URL.revokeObjectURL(url); throw e; }
    src = img; w = img.naturalWidth; h = img.naturalHeight; done = () => URL.revokeObjectURL(url);
  }
  if (!w || !h) { done(); throw new Error('الملف ليس صورة'); }
  const scale = Math.min(1, MAX / Math.max(w, h));
  const cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  const c = cv.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, cw, ch); c.drawImage(src, 0, 0, cw, ch);
  done();
  const blob = await canvasBlob(cv, 'image/jpeg', 0.7);
  cv.width = cv.height = 0;
  return blob;
}
const Photo = {
  target: null,
  /** Camera or library → shrunk JPEG kept on the phone → sent on the next sync. */
  take(kind, ref, day, title, draft, done) {
    Photo.target = { kind, ref, day, title, draft: !!draft, done, tok: Nav.tok };
    choose('صورة ' + title, ['📷 الكاميرا', '🖼 من المعرض'], null, i => {
      const inp = $(i === 0 ? '#cam' : '#gal'); inp.value = ''; inp.click(); return true;
    });
  },
  async onFile(file) {
    const t = Photo.target; if (!t || !file) return;
    Photo.target = null;
    const id = Fmt.uuid();
    try {
      const blob = await shrinkPhoto(file);
      await Store.addPhoto(id, t.kind, t.ref, t.day, await readBuf(blob), 'image/jpeg', t.title, t.draft ? Store.DRAFT : Store.PENDING);
    } catch (e) { toastLong('تعذّر حفظ الصورة: ' + errText(e)); return; }
    if (t.draft && !Nav.live(t.tok)) { Store.dropPhoto(id); return; }   // its form was closed meanwhile
    toast(t.draft ? 'حُفظت الصورة ✓' : 'حُفظت الصورة — تُرسل مع المزامنة');
    if (t.done && Nav.live(t.tok)) t.done();

  constructor(w, withLogo) {

    this.y = this.pad;

  }
  paint(size, bold = false) { return { size: this.wide ? size * 1.3 : size, bold }; }
  _font(p) { this.c.font = (p.bold ? 'bold ' : '') + p.size + 'px ' + SLIP_FONT; }

  dt(t, x, y, p) { this._font(p); try { this.c.direction = dirOf(t); } catch (e) {} this.c.textAlign = 'left'; this.c.fillStyle = '#000'; this.c.fillText(t, x, y); }

  wrapCenter(t, p = this.normal) {

    for (const word of t.split(' ')) {

  space(px = 10) { this.y += px; return this; }
  signature(label = 'توقيع المستلم') {

  bitmap(footer = 'شكراً لتعاملكم معنا') {

  voucher(m, p) {

    if (str(p, 'note').trim()) s.text(str(p, 'note'));

    return s.bitmap();
  },
  deposit(p) {

    return s.bitmap('');
  }
};

// ------------------------------------------------------------------ printing on an iPhone: share the slip picture or print it
function downloadBlob(blob, fname) {
  const u = URL.createObjectURL(blob);
  const a = el('a', { href: u, download: fname }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
  toast('حُفظت صورة الورقة');
}
function shareFile(file, blob) {
  try {
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).catch(e => { if (e && e.name === 'AbortError') return; downloadBlob(blob, file.name); });
      return;
    }
  } catch (e) {}
  downloadBlob(blob, file.name);
}
function printImage(url) {
  const img = $('#print-img');
  document.documentElement.style.setProperty('--paper', (Prefs.paperMm >= 80 ? 72 : 48) + 'mm');
  const go = () => setTimeout(() => { try { window.print(); } catch (e) { toast('الطباعة غير متاحة على هذا الهاتف'); } }, 60);
  if (img.src === url && img.complete) { go(); return; }
  img.onload = go; img.src = url;
}
/**
 * Where the Android app sends the slip to the Bluetooth printer, the iPhone shows
 * the same slip with «مشاركة / واتساب» and «طباعة». [after] runs when the sheet closes.
 */
async function printSlip(cv, after, name) {
  let blob;
  try { blob = await canvasBlob(cv); } catch (e) { toastLong(errText(e)); after && after(); return; }
  const fname = (name || 'cashvan').replace(/[^\w؀-ۿ.-]+/g, '-') + '.png';
  const file = new File([blob], fname, { type: 'image/png' });
  const url = URL.createObjectURL(blob);
  const box = ui.vbox();
  box.append(el('div', { class: 'slipwrap' }, el('img', { src: url, class: 'slipimg', alt: 'الورقة' })));
  box.append(ui.button('📤 مشاركة / واتساب', 0, () => shareFile(file, blob)));
  box.append(ui.button('🖨 طباعة', 1, () => printImage(url)));
  Dlg.show({ title: 'طباعة / مشاركة', content: box, buttons: [{ label: 'إغلاق', role: 'pos' }],
    onClose: () => { setTimeout(() => URL.revokeObjectURL(url), 120000); if (after) after(); } });
}

// ------------------------------------------------------------------ reminder (no alarms on the web: a banner after the hour, and one notification a day while open)
const Reminder = {
  /** What is still open, in one line; null when nothing is. */
  message() {
    const s = new Summary(Fmt.today()); const parts = [];
    const miss = s.missing().length; if (miss > 0) parts.push('📷 ' + miss + ' بلا صورة (مشتريات/مصاريف/إيداع)');
    const und = s.undeposited; if (und > 0.5) parts.push('🏦 غير مودع ' + Fmt.money(und) + ' د.ا');
    const unsent = Store.unsentCount(); if (unsent > 0) parts.push('📤 ' + unsent + ' لم يُرسل');
    return parts.length ? parts.join(' · ') : null;
  },
  due() { const h = Prefs.reminderHour; return h >= 0 && new Date().getHours() >= h; },
  notifyOnce(text) {
    try {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      const today = Fmt.today(); if (localStorage.getItem('cv2_notified') === today) return;
      localStorage.setItem('cv2_notified', today);
      const title = 'كاش فان — قبل نهاية اليوم'; const opt = { body: text, icon: 'icon-192.png', tag: 'daily', lang: 'ar', dir: 'rtl' };
      if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r => r.showNotification(title, opt)).catch(() => {});
      else new Notification(title, opt);
    } catch (e) {}
  }
};

/** Van number + PIN (set by the office from the dashboard: السيارات → رمز دخول التطبيق). */
Screens.login = function () {
  const S = screen('كاش فان — تسجيل الدخول', false); const b = S.body;
  b.append(m(ui.text('🐔', 56, false, C.text, true), { top: 24 }));
  b.append(m(ui.text(Config.COMPANY, 18, true, C.primary, true), { top: 6 }));
  b.append(m(ui.text('أدخل رقم السيارة والرمز الذي أعطاك إياه المكتب', 14, false, C.muted, true), { top: 6, bottom: 18 }));
  const card = ui.card();
  const [vb, van] = ui.field('رقم السيارة', Prefs.vanNo > 0 ? String(Prefs.vanNo) : '', 'int'); van.id = 'login-van';
  const [pb, pin] = ui.field('الرمز', '', 'pin'); pin.id = 'login-pin';
  card.append(vb, pb);
  const err = ui.banner('', C.bad, C.badSoft); err.style.display = 'none'; err.id = 'login-err';
  card.append(err);
  const go = ui.button('دخول', 0, async () => {
    const v = toIntOrNull(van.value.trim());
    if (v === null || pin.value.length < 4) { err.textContent = 'اكتب رقم السيارة والرمز'; err.style.display = ''; return; }
    go.disabled = true; go.textContent = 'جارٍ الدخول…'; err.style.display = 'none';
    let syncErr = null;
    try {
      // each van owns what this phone saved: never send van 1's unsent sales under van 2
      const owner = toIntOrNull(Store.kv('owner_van'));
      if (owner !== null && owner !== v) {
        if (Store.unsentCount() > 0 || Store.pendingPhotos().length > 0) throw new ApiError('على هذا الهاتف مستندات لم تُرسل للسيارة ' + owner + ' — ادخل بها أولاً حتى تُرسل');
      }
      const r = await Api.obj('app_login', { p_van: v, p_pin: pin.value.trim(), p_device: deviceName(), p_version: Config.VERSION + ' web' });
      if ('error' in r) throw new ApiError(str(r, 'error'));
      if (owner !== null && owner !== v) await Store.clearAll();
      await Store.setKv('owner_van', String(v));
      Sync.sessionEnded = false;
      Prefs.token = str(r, 'token'); Prefs.vanNo = v; Prefs.vanName = str(r, 'van_name');
      syncErr = await Sync.run(true);
    } catch (e) {
      if (!S.live()) return;
      go.disabled = false; go.textContent = 'دخول';
      err.textContent = errText(e); err.style.display = ''; return;
    }
    if (!Prefs.signedIn) return;
    if (syncErr) toastLong('دخلت، لكن لم تكتمل المزامنة: ' + syncErr);
    Nav.replace('/home');
  });
  go.id = 'login-go';
  pin.addEventListener('keydown', e => { if (e.key === 'Enter') go.click(); });
  card.append(go);
  b.append(card);
  b.append(m(ui.text('الإصدار ' + Config.VERSION, 12, false, C.muted, true), { top: 16 }));
};
function deviceName() {
  const ua = navigator.userAgent;
  const dev = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ? 'iPad' : /Android/.test(ua) ? 'Android' : 'Browser';
  const v = /OS (\d+)[_.](\d+)/.exec(ua);
  return dev + (v && dev !== 'Browser' && dev !== 'Android' ? ' iOS ' + v[1] + '.' + v[2] : '') + ' · ويب';
}

/** New sale: customer, items, cash or credit, save → print → sent on sync. */
Screens.sale = function (_, params) {
  const mm = Master.load();
  if (!mm) { toastLong('زامن أولاً'); Nav.finish(); return; }
  // editing an existing invoice: ?edit=<id>&day=<day> (allowed per van by the office)
  const editId = params.get('edit') || null; let editDoc = null;
  if (editId) {

  async function doSave(c, tot, paid, printIt) {

  /** the edited invoice goes to the database as one change (app_update_invoice); the phone shows it at once */

    saved = true; S.hideFooter();

    try {
      // an invoice still on the phone only: change it in place; a sent one: queue the change

    Sync.run(false);
    toast('حُفظ تعديل الفاتورة ' + number);
    if (printIt) printSlip(bmp, () => Nav.finish(), 'invoice-' + number); else Nav.finish();
  }
  const cid = toIntOrNull(params.get('c'));
  if (cid) { const c = mm.customer(cid); if (c) setCustomer(c); }
  if (editDoc) {
    const j = editDoc.json; const c = mm.customer(num(j.customer_id)) || mm.customers.find(x => x.name === str(j, 'customer_name'));
    if (c) setCustomer(c);

    const p0 = editDoc.local ? j : serverInvoiceOf(j, day);
    paidEdit.value = credit ? String(Fmt.round2(num(p0.paid))) : '';
  }
  refresh();
  if (!customer) pickCustomer();

    const mm = Master.load(); if (!mm) return;
    totalRow.innerHTML = '';
    const tBefore = mm.customers.reduce((a, c) => a + c.totalDue, 0), tChq = mm.customers.reduce((a, c) => a + c.chequesPending, 0), tAfter = mm.customers.reduce((a, c) => a + c.balance, 0);
    totalRow.append(ui.row('مجموع الذمم قبل تحصيل الشيكات', Fmt.money(tBefore), true, C.primary));
    if (tChq > 0.005) {
      totalRow.append(ui.row('شيكات غير محصلة', Fmt.money(tChq), false, C.blue, 14));
      totalRow.append(ui.row('مجموع الذمم بعد تحصيل الشيكات', Fmt.money(tAfter), true, C.primary));
    }
    list.innerHTML = '';
    const k = nameKey(q);
    const cs = mm.customers.filter(c => !k || nameKey(c.name).includes(k) || String(c.number) === q.trim());
    for (const c of cs) {
      const card = ui.card(); card.style.padding = '10px 12px'; card.classList.add('click'); card.dataset.cid = c.id; card.onclick = () => actions(c);
      const top = ui.hbox();
      top.append(grow(ui.text(c.number + ' · ' + c.name, 16, true)));
      const v = ui.text(Fmt.money(c.totalDue), 16, true, c.totalDue > 0.005 ? C.bad : C.ok); v.dir = 'ltr'; top.append(v);
      card.append(top);
      const tags = ui.hbox(); tags.style.paddingTop = '4px'; tags.style.flexWrap = 'wrap'; tags.style.rowGap = '4px';
      tags.append(c.cashOnly ? ui.pill('نقدي', C.ok, C.okSoft) : ui.pill('ذمم', C.warn, C.warnSoft));
      if (c.creditLimit != null && c.creditLimit > 0 && c.totalDue > c.creditLimit) tags.append(m(ui.pill('فوق السقف', C.bad, C.badSoft), { start: 6 }));
      if (c.chequesPending > 0) { tags.append(m(ui.pill('شيكات ' + Fmt.money(c.chequesPending), C.blue, C.blueSoft), { start: 6 })); tags.append(m(ui.pill('بعد الشيكات ' + Fmt.money(c.balance), c.balance > 0.005 ? C.warn : C.ok, c.balance > 0.005 ? C.warnSoft : C.okSoft), { start: 6 })); }
      if (c.lastPayment) tags.append(ui.text('  آخر دفعة ' + Fmt.pretty(c.lastPayment), 12, false, C.muted));
      card.append(tags);
      list.append(card);
    }
    if (!cs.length) list.append(ui.text('لا نتائج', 14, false, C.muted, true));
  }
  function actions(c) {
    if (stmtMode) { statement(c); return; }
    const opts = ['🧾 فاتورة جديدة', '💵 سند قبض', '📄 كشف حساب'];
    if (c.phone) opts.push('📞 اتصال ' + c.phone);
    choose(c.name, opts, i => {
      if (i === 0) Nav.go('/sale?c=' + c.id);
      else if (i === 1) Nav.go('/collection?c=' + c.id);
      else if (i === 2) statement(c);
    }, i => { if (i === 3) { location.href = 'tel:' + c.phone.replace(/[^\d+]/g, ''); return true; } return false; });
  }
  async function statement(c) {
    const to = Fmt.today(); const from = to.substring(0, 8) + '01';
    toast('جارٍ تحميل الكشف…');
    let r;
    try { r = await Api.obj('app_statement', { p_token: Prefs.token, p_customer: c.id, p_from: from, p_to: to }); }
    catch (e) {
      if (e instanceof ApiError && e.sessionEnded) { Sync.sessionEnded = true; Sync.afterRun(); return; }
      if (S.live()) info('تعذّر تحميل الكشف', errText(e) + '\nالكشف يحتاج إنترنت.'); return;
    }
    if (S.live()) showStatement(c, r);
  }
  function showStatement(c, r) {
    const cu = r.customer || {};
    let bal = num(cu.opening);
    const box = ui.vbox(); box.id = 'stmt-box';
    box.append(ui.text(c.name + ' — من ' + Fmt.pretty(str(r, 'from')) + ' إلى ' + Fmt.pretty(str(r, 'to')), 15, true));
    box.append(ui.row('الرصيد السابق', Fmt.money(bal), true));
    const printRows = [];
    for (const x of (r.rows || [])) {
      const d = num(x.debit), cr = num(x.credit);
      bal += d - cr;
      box.append(ui.row(Fmt.pretty(str(x, 'day')) + '  ' + str(x, 'kind') + ' ' + str(x, 'ref'), (d > 0 ? '+' + Fmt.money(d) : '−' + Fmt.money(cr)) + '  =  ' + Fmt.money(bal), false, C.text, 13));
      printRows.push([str(x, 'day').slice(-5).replace('-', '/') + ' ' + str(x, 'ref'), d > 0 ? Fmt.plainMoney(d) : '', cr > 0 ? Fmt.plainMoney(cr) : '', Fmt.plainMoney(bal)]);
    }
    box.append(ui.divider());
    const chq = num(cu.cheques_pending);
    if (chq > 0.005) {
      box.append(ui.row('الذمة قبل تحصيل الشيكات', Fmt.money(bal + chq), true, bal + chq > 0.005 ? C.bad : C.ok, 16));
      box.append(ui.row('شيكات برسم التحصيل', Fmt.money(chq), false, C.blue, 14));
      box.append(ui.row('الذمة بعد تحصيل الشيكات', Fmt.money(bal), true, bal > 0.005 ? C.bad : C.ok, 17));
    } else box.append(ui.row('الرصيد الحالي', Fmt.money(bal), true, bal > 0.005 ? C.bad : C.ok, 17));
    Dlg.show({ title: 'كشف حساب', content: box, buttons: [
      { label: 'طباعة', role: 'pos', click: async () => {
        await logoReady;
        const s = new Slip(Prefs.paperDots, Prefs.printLogo).header('كشف حساب عميل');
        s.pair('العميل', c.name, s.bold, s.bold).pair('من', Fmt.pretty(str(r, 'from'))).pair('إلى', Fmt.pretty(str(r, 'to')));
        s.pair('الرصيد السابق', Fmt.plainMoney(num(cu.opening))).divider(false);
        s.table(['البيان', 'مدين', 'دائن', 'الرصيد'], printRows, [0.2, 0.16, 0.16]);
        if (chq > 0.005) { s.pair('الذمة قبل تحصيل الشيكات', Fmt.plainMoney(bal + chq)).pair('شيكات برسم التحصيل', Fmt.plainMoney(chq)); s.box('الذمة بعد تحصيل الشيكات', Fmt.plainMoney(bal)); }
        else s.box('الرصيد', Fmt.plainMoney(bal));
        printSlip(s.bitmap(), null, 'statement-' + c.number);
      } },
      { label: 'إغلاق', role: 'neg' }] });
  }
  function addCustomer() {
    const box = ui.vbox();
    const [nb, name] = ui.field('اسم العميل'); name.id = 'newcust-name';
    const [pb, phone] = ui.field('الهاتف (اختياري)', '', 'phone');
    let kind = 'نقدي';
    box.append(nb, pb);
    box.append(ui.text('نوع العميل (المكتب يستطيع تغييره)', 13, false, C.muted));
    box.append(ui.segments(['نقدي', 'ذمم'], 0, i => { kind = i === 1 ? 'ذمم' : 'نقدي'; }));
    const d = Dlg.show({ title: 'عميل جديد', content: box, buttons: [
      { label: 'حفظ', role: 'pos', now: () => { d.n = name.value.trim(); d.ph = phone.value.trim(); }, click: async () => {
        const n = d.n; if (!n) { toast('اكتب الاسم'); return; }
        try {
          await Api.obj('app_add_customer', { p_token: Prefs.token, p: { name: n, phone: d.ph, kind } });
          await Sync.run(true);
        } catch (e) {
          if (e instanceof ApiError && e.sessionEnded) { Sync.sessionEnded = true; Sync.afterRun(); return; }
          if (S.live()) info('لم يُحفظ العميل', errText(e) + '\nإضافة عميل تحتاج إنترنت.'); return;
        }
        if (S.live()) { fill(); toast('أُضيف العميل'); }
      } },
      { label: 'إلغاء', role: 'neg' }] });
  }
  fill();
};

// ------------------------------------------------------------------ مشتريات جديدة
/** A purchase slip from one company. The photo can be taken now or later. */
Screens.purchase = function () {
  const mm = Master.load();
  if (!mm) { toastLong('زامن أولاً'); Nav.finish(); return; }
  if (!mm.allowed('السماح بإدخال مشتريات', true)) { toastLong('إدخال المشتريات غير مسموح لهذه السيارة'); Nav.finish(); return; }
  const lines = []; let day = Fmt.today(); const batch = Fmt.uuid(); let saved = false;
  // a picture taken for something never saved must not go up on its own
  Nav.onLeave = () => { if (!saved) Store.dropPhotos(batch); };
  const S = screen('مشتريات جديدة'); const b = S.body;
  if (mm.allowed('اختيار التاريخ للمشتريات', false)) {
    const [db, dt] = ui.chooser('التاريخ', Fmt.pretty(day), () => pickDay(day, mm.intSetting('عدد الأيام المسموح الرجوع لها', 3), d => { day = d; dt.setValue(Fmt.pretty(d)); }));
    b.append(db);
  }
  b.append(ui.text('الشركة', 13, false, C.muted));
  const comps = mm.companies;
  let company = (comps.includes(Store.kv('last_company')) ? Store.kv('last_company') : comps[0]) || '';
  const labels = comps.map(c => { const t = ui.text(c, 15, true, C.text, true); Object.assign(t.style, { padding: '12px 6px', borderRadius: '10px', border: '1px solid', cursor: 'pointer' }); t.setAttribute('role', 'button'); t.dataset.company = c; t.onclick = () => { company = c; paint(); }; return t; });
  const paint = () => labels.forEach((t, i) => { const sel = comps[i] === company; const cc = mm.companyColor(comps[i]) || C.blue; t.style.background = sel ? cc : C.surface; t.style.borderColor = cc; t.style.color = sel ? '#fff' : cc; });
  b.append(ui.grid(labels, 3)); paint();
  b.append(ui.section('الأصناف', 'اكتب السعر 0 للوزن المجاني'));
  const linesBox = ui.vbox(); linesBox.id = 'pur-lines'; b.append(linesBox);
  b.append(ui.button('+ إضافة صنف', 3, () => addLine(null)));
  const [nb, note] = ui.field('ملاحظة (اختياري)'); b.append(nb);
  const photoText = ui.text('', 14, true); photoText.style.padding = '6px 4px'; photoText.id = 'pur-photo';
  const pbtn = ui.button('📷 تصوير فاتورة الشركة', 1, () => Photo.take('purchase', batch, day, 'مشتريات ' + company, true, refresh)); pbtn.id = 'pur-photo-btn';
  b.append(pbtn, photoText);
  const totalText = ui.text('', 20, true, C.blue, true); totalText.style.paddingTop = '8px'; totalText.id = 'pur-total'; b.append(totalText);
  const sb = ui.button('حفظ', 0, () => save()); sb.id = 'pur-save'; S.showFooter(sb);

  function addLine(edit) {
    if (edit) { ask2(edit.item, edit); return; }
    let its = mm.items.filter(i => i.company === company); if (!its.length) its = mm.items;
    choose('صنف من ' + company, its.map(i => i.name), i => ask2(its[i], null));
  }
  function ask2(item, edit) {
    const box = ui.vbox();
    box.append(ui.text(item.name, 18, true, C.blue));
    const [qb, q] = ui.field('الوزن (كغم)', edit ? Fmt.kg(edit.qty) : '', 'number'); q.id = 'qty-in';
    const [pb, p] = ui.field('السعر', edit ? String(edit.price) : '', 'number'); p.id = 'price-in';
    box.append(m(qb, { top: 8 }), pb);
    const buttons = [
      { label: 'تم', role: 'pos', keep: true, click: d => {
        const qty = Fmt.parse(q.value); const price = Fmt.parse(p.value) ?? 0;
        if (qty === null || qty === 0) { q.setError('اكتب الوزن'); return; }
        if (edit) { edit.qty = qty; edit.price = price; } else lines.push({ item, qty, price });
        Dlg.close(d, refresh);
      } },
      { label: 'إلغاء', role: 'neg' }];
    if (edit) buttons.push({ label: 'حذف', role: 'neu', click: () => { lines.splice(lines.indexOf(edit), 1); refresh(); } });
    Dlg.show({ title: 'سطر مشتريات', content: box, buttons });
    setTimeout(() => q.focus(), 60);
  }
  function refresh() {
    if (!S.live()) return;
    linesBox.innerHTML = '';
    if (!lines.length) linesBox.append(ui.text('لم تُضف أصناف بعد', 14, false, C.muted, true));
    for (const l of lines) {
      const row = ui.card(); row.style.padding = '10px 12px'; row.classList.add('click'); row.onclick = () => addLine(l);
      const top = ui.hbox();
      top.append(grow(ui.text(l.item.name + (l.price === 0 ? '  (مجاني)' : ''), 16, true)));
      const a = ui.text(Fmt.money(l.qty * l.price), 16, true, C.blue); a.dir = 'ltr'; top.append(a);
      row.append(top, ui.text(Fmt.kg(l.qty) + ' كغم × ' + Fmt.money3(l.price), 13.5, false, C.muted));
      linesBox.append(row);
    }
    totalText.textContent = Fmt.kg(lines.reduce((s, l) => s + l.qty, 0)) + ' كغم  ·  ' + Fmt.money(lines.reduce((s, l) => s + l.qty * l.price, 0)) + ' د.ا';
    const has = Store.hasPhoto('purchase', batch);
    photoText.textContent = has ? '✓ صُوّرت الفاتورة' : 'بلا صورة بعد — يمكنك تصويرها الآن أو لاحقاً';
    photoText.style.color = has ? C.ok : C.warn;
  }
  async function save() {
    if (!company) { toast('اختر الشركة'); return; }
    if (!lines.length) { toast('أضف صنفاً'); return; }
    const p = { batch, day, company, note: note.value.trim(), lines: lines.map(l => ({ item: l.item.name, item_id: l.item.id, qty: Fmt.round3(l.qty), price: l.price })) };
    if (saved) return;
    saved = true; S.hideFooter();
    try {
      await Store.add('purchase', batch, day, 'مشتريات ' + company, Fmt.round2(lines.reduce((s, l) => s + l.qty * l.price, 0)), p);
      await Store.commitPhotos(batch);
      await Store.setKv('last_company', company);
    } catch (e) { saved = false; S.showFooter(sb); info('لم تُحفظ المشتريات', errText(e)); return; }
    Sync.run(false);
    if (!Store.hasPhoto('purchase', batch)) toastLong('حُفظت المشتريات — تذكير: صوّر فاتورة الشركة من «فواتير المشتريات»');
    else toast('حُفظت المشتريات');
    Nav.finish();
  }
  refresh();
};

/**
 * mode = "expense": a van expense, with the photo of its receipt (required).
 * mode = "deposit": cash or cheques put in the bank, with the bank slip photo (required).
 */
Screens.money = function (mode) {
  const mm = Master.load();
  if (!mm) { toastLong('زامن أولاً'); Nav.finish(); return; }
  const deposit = mode === 'deposit';
  const id = Fmt.uuid(); const day = Fmt.today(); let saved = false;
  Nav.onLeave = () => { if (!saved) Store.dropPhotos(id); };
  const S = screen(deposit ? 'إيداع في البنك' : 'مصروف جديد'); const b = S.body;
  const photoText = ui.text('', 14, true); photoText.style.padding = '6px 4px'; photoText.id = 'money-photo';
  const paintPhoto = kind => { if (!S.live()) return; const has = Store.hasPhoto(kind, id); photoText.textContent = has ? '✓ الصورة جاهزة' : 'لم تُصوَّر بعد'; photoText.style.color = has ? C.ok : C.bad; };
  const photoButton = (kind, title) => {
    const pb = ui.button(kind === 'deposit' ? '📷 تصوير إيصال البنك (مطلوب)' : '📷 تصوير إيصال المصروف (مطلوب)', 1, () => Photo.take(kind, id, day, title, true, () => paintPhoto(kind)));
    pb.id = 'money-photo-btn'; b.append(pb, photoText); paintPhoto(kind);
  };
  if (!deposit) {
    let cat = '';
    const [cb, ct] = ui.chooser('نوع المصروف', '', () => choose('نوع المصروف', mm.expenseCategories, i => { cat = mm.expenseCategories[i]; ct.setValue(cat); }));
    ct.id = 'exp-cat'; b.append(cb);
    const [ab, amount] = ui.field('المبلغ (د.ا)', '', 'number'); amount.id = 'money-amount'; b.append(ab);
    let method = 'نقدي';
    b.append(ui.text('دُفع', 13, false, C.muted));
    b.append(ui.segments(['نقداً من السيارة', 'تحويل بنكي'], 0, i => { method = i === 0 ? 'نقدي' : 'تحويل بنكي'; }));
    const [nb, note] = ui.field('ملاحظة (اختياري)'); b.append(nb);
    photoButton('expense', 'مصروف');
    b.append(ui.text('المصروف النقدي يُنقص ما عليك إيداعه في البنك.', 12.5, false, C.muted));
    const sb = ui.button('حفظ', 0, async () => {
      const amt = Fmt.parse(amount.value);
      if (!cat) { toast('اختر نوع المصروف'); return; }
      if (amt === null || amt <= 0) { toast('اكتب المبلغ'); return; }
      if (!Store.hasPhoto('expense', id)) { toast('صوّر إيصال المصروف أولاً'); return; }
      const p = { id, day, category: cat, amount: amt, method, note: note.value.trim() };
      if (saved) return;
      saved = true; S.hideFooter();
      try { await Store.add('expense', id, day, cat, amt, p); await Store.commitPhotos(id); }
      catch (e) { saved = false; S.showFooter(sb); info('لم يُحفظ المصروف', errText(e)); return; }
      Sync.run(false); toast('حُفظ المصروف'); Nav.finish();
    });
    sb.id = 'money-save'; S.showFooter(sb);
    return;
  }
  // ------------------------------------------------------------------ deposit
  const s = new Summary(Fmt.today());
  const top = ui.card(C.purpleSoft, 'transparent');
  top.append(ui.text('غير مودع حتى الآن', 13, false, C.muted));
  const ut = ui.text(Fmt.money(s.undeposited) + ' د.ا', 24, true, C.purple); ut.dir = 'ltr'; top.append(ut);
  b.append(top);
  let cheques = false;
  const cashBox = ui.vbox(), chqBox = ui.vbox();
  b.append(ui.text('نوع الإيداع', 13, false, C.muted));
  const seg = ui.segments(['💵 نقدي (كاش)', '📝 شيكات'], 0, i => { cheques = i === 1; cashBox.style.display = cheques ? 'none' : ''; chqBox.style.display = cheques ? '' : 'none'; });
  seg.id = 'dep-kind'; b.append(seg);
  const [ab, amount] = ui.field('المبلغ المودع (د.ا)', '', 'number'); amount.id = 'money-amount';
  cashBox.append(ab); b.append(cashBox);
  // cheques waiting, less any this phone already deposited but has not sent
  const usedLocal = new Set([...Store.pending(), ...Store.failed(), ...Store.ofDay(Fmt.today())].filter(o => o.kind === 'deposit').flatMap(o => (o.payload.cheque_ids || []).map(String)));
  const waiting = mm.cheques.filter(w => !usedLocal.has(w.id));
  const checks = [];
  const sumText = ui.text('', 15, true, C.purple);
  if (!waiting.length) chqBox.append(ui.text('لا شيكات بانتظار الإيداع', 14, false, C.muted));
  for (const w of waiting) {
    const cbx = el('input', { type: 'checkbox' }); cbx.dataset.cheque = w.id;
    cbx.onchange = () => { sumText.textContent = 'المجموع ' + Fmt.money(checks.filter(x => x[0].checked).reduce((a, x) => a + x[1].amount, 0)); };
    const lab = el('label', { class: 'chk', style: { fontSize: fs(15) } }, cbx, el('span', { class: 't' }, w.customer + ' · شيك ' + w.no + ' · ' + Fmt.money(w.amount)));
    checks.push([cbx, w]); chqBox.append(lab);
  }
  chqBox.append(sumText); chqBox.style.display = 'none';
  b.append(chqBox);
  const [bb, bank] = ui.field('البنك'); bank.id = 'dep-bank';
  const [rb, ref] = ui.field('رقم إيصال البنك', '', 'text'); ref.id = 'dep-ref';
  b.append(bb, rb);
  photoButton('deposit', 'إيداع');
  const sb = ui.button('حفظ الإيداع', 0, async () => {
    if (!Store.hasPhoto('deposit', id)) { toast('صوّر إيصال البنك أولاً'); return; }
    const p = { id, day, kind: cheques ? 'cheque' : 'cash', bank: bank.value.trim(), reference: ref.value.trim() };
    let amt;
    if (cheques) {
      const sel = checks.filter(x => x[0].checked).map(x => x[1]);
      if (!sel.length) { toast('اختر الشيكات'); return; }
      p.cheque_ids = sel.map(w => w.id);
      p.cheques_shown = sel.map(w => ({ customer: w.customer, no: w.no, amount: w.amount }));
      amt = sel.reduce((a, w) => a + w.amount, 0);
    } else {
      amt = Fmt.parse(amount.value) ?? 0;
      if (amt <= 0) { toast('اكتب المبلغ'); return; }
    }
    p.amount = amt;
    if (saved) return;
    saved = true; S.hideFooter();
    try { await Store.add('deposit', id, day, cheques ? 'إيداع شيكات' : 'إيداع نقدي', amt, p); await Store.commitPhotos(id); }
    catch (e) { saved = false; S.showFooter(sb); info('لم يُحفظ الإيداع', errText(e)); return; }
    Sync.run(true); toast('حُفظ الإيداع');
    await logoReady;
    Dlg.show({ title: 'حُفظ الإيداع', content: 'طباعة إيصال للسائق؟', cancelable: false, buttons: [
      { label: 'طباعة', role: 'pos', click: () => printSlip(Docs.deposit(p), () => Nav.finish(), 'deposit') },
      { label: 'لا', role: 'neg', click: () => Nav.finish() }] });
  });
  sb.id = 'money-save'; S.showFooter(sb);
};

  if (['invoice', 'collection', 'purchase', 'money'].includes(mode)) {
