    const prev = ui.text('→ السابق', 15, true, C.primary); prev.style.padding = '8px'; prev.classList.add('click'); prev.onclick = () => move(-1); prev.id = 'list-prev';
    dayText = grow(ui.text('', 16, true, C.text, true));
    const next = ui.text('التالي ←', 15, true, C.primary); next.style.padding = '8px'; next.classList.add('click'); next.onclick = () => move(1); next.id = 'list-next';
    nav.append(prev, dayText, next); b.append(nav);
  }
  const list = ui.vbox(); list.id = 'list'; b.append(list);
  const kindName = k => ({ invoice: 'فاتورة', collection: 'سند قبض', purchase: 'مشتريات', expense: 'مصروف', deposit: 'إيداع', transfer: 'تحويل', count: 'جرد', delete_invoice: 'حذف فاتورة' }[k] || k);

  async function move(d) {
    const next = Fmt.daysBack(day, -d);
    if (next > Fmt.today()) return;
    day = next;
    if (DayData.load(day) === null || day === Fmt.today()) {
      fill(); toast('جارٍ التحميل…');
      try { await Sync.fetchDay(day); } catch (e) { if (e instanceof ApiError && e.sessionEnded) { Sync.sessionEnded = true; Sync.afterRun(); return; } toast(errText(e)); }
      if (S.live()) fill();
    } else fill();
  }
  function fill() {
    if (!S.live()) return;
    if (dayText) dayText.textContent = Fmt.dayName(day);
    list.innerHTML = '';
    const s = new Summary(day);
    let docs;
    if (mode === 'unsent') docs = [...Store.failed(), ...Store.pending()].map(o => Doc(o.id, o.kind, o.title, kindName(o.kind) + ' · ' + Fmt.pretty(o.day), o.amount, true, o.status, o.error, o.payload));
    else if (mode === 'missing') docs = s.missing();
    else if (mode === 'money') docs = [...s.docs('expense'), ...s.docs('deposit')];
    else docs = s.docs(mode);
    if (mode === 'unsent' && Store.pendingPhotos().length) list.append(ui.banner('📷 ' + Store.pendingPhotos().length + ' صورة بانتظار الإرسال', C.warn, C.warnSoft));
    if (!docs.length) { const t = ui.text(mode === 'missing' ? 'كل شيء له صورة 👍' : 'لا شيء هنا', 15, false, C.muted, true); t.style.paddingTop = '30px'; list.append(t); return; }
    const live = docs.filter(d => !d.deleted);
    if (!['unsent', 'missing'].includes(mode)) list.append(ui.row('العدد ' + live.length, 'المجموع ' + Fmt.money(live.reduce((a, d) => a + d.amount, 0)), true, C.primary));
    for (const d of docs) list.append(card(d, s));
  }
  function card(d, s) {
    const mm = Master.load();
    const cc = d.kind === 'purchase' && mm ? mm.companyColor(d.json.company != null ? str(d.json, 'company') : d.title.replace(/^مشتريات /, '').trim()) : null;
    const c = cc ? ui.card(C.surface, cc) : ui.card();
    c.style.padding = '10px 12px'; c.classList.add('click', 'doc'); c.dataset.id = d.id; c.onclick = () => act(d, s);
    if (d.deleted) c.style.opacity = '0.5';
    const top = ui.hbox();
    top.append(grow(ui.text(d.title, 15.5, true)));
    if (d.amount !== 0) { const a = ui.text(Fmt.money(d.amount), 15.5, true, C.primary); a.dir = 'ltr'; top.append(a); }
    c.append(top);
    const tags = ui.hbox(); tags.style.paddingTop = '4px'; tags.style.gap = '6px';
    tags.append(grow(ui.text(d.sub, 13, false, C.muted)));
    if (d.deleted) tags.append(ui.pill('محذوفة', C.bad, C.badSoft));
    else if (d.edited && d.status === Store.PENDING) tags.append(ui.pill('✏ تعديل لم يُرسل', C.warn, C.warnSoft));
    else if (d.status === Store.PENDING) tags.append(ui.pill('⏳ لم تُرسل', C.warn, C.warnSoft));
    else if (d.status === Store.FAILED) tags.append(ui.pill('⚠ مرفوضة', C.bad, C.badSoft));
    else tags.append(ui.pill('✓', C.ok, C.okSoft));
    if (['purchase', 'expense', 'deposit'].includes(d.kind) && mode !== 'unsent') {
      const has = s.has(d.kind, d) || (mode === 'missing' && Store.hasPhoto(d.kind, d.id));
      const imported = str(d.json, 'source') === 'excel_import';
      if (!imported) tags.append(has ? ui.pill('📷', C.ok, C.okSoft) : ui.pill('📷 بلا صورة', C.bad, C.badSoft));
    }
    c.append(tags);
    if (d.status === Store.FAILED && d.error != null) c.append(ui.text('السبب: ' + d.error, 13, true, C.bad));
    return c;
  }
  function act(d, s) {
    const mm = Master.load();
    if (mode === 'unsent') {
      const opts = ['🔁 إعادة الإرسال'];
      if (d.status === Store.FAILED) opts.push('🗑 حذفه من الهاتف');
      choose(d.title, opts, async i => {
        if (i === 0) { await Store.retry(d.id); const e = await Sync.run(true); toast(e || 'أُرسل ✓'); fill(); }
        else confirmDlg('حذف من الهاتف', 'لن يصل هذا للمكتب أبداً. متأكد؟', 'حذف', async () => { await Store.discard(d.id); await Store.dropPhotos(d.id); fill(); });
      });
      return;
    }
    if (['purchase', 'expense', 'deposit'].includes(d.kind)) {
      Photo.take(d.kind, d.id, str(d.json, 'day') || day, d.title, false, fill);
      return;
    }
    const canEdit = key => !d.deleted && mm && mm.allowed(key, false) && day >= Fmt.daysBack(Fmt.today(), mm.intSetting('عدد الأيام المسموح الرجوع لها', 3));
    if (d.kind === 'invoice') {
      const p = d.local ? d.json : serverInvoice(d.json);
      const acts = [['👁 عرض التفاصيل', () => showInvoice(d, p)], ['🖨 إعادة طباعة', async () => { await logoReady; printSlip(Docs.invoice(mm, p, true), null, 'invoice-' + str(p, 'number')); }]];
      if (canEdit('السماح بتعديل فاتورة')) acts.push(['✏ تعديل الفاتورة', () => Nav.go('/sale?edit=' + d.id + '&day=' + day)]);
      if (!d.deleted && mm && mm.allowed('السماح بحذف فاتورة', false)) acts.push(['🗑 حذف الفاتورة', () => ask('حذف الفاتورة', 'سبب الحذف (مطلوب)', 'text', '', async reason => {
          if (!reason) { toast('اكتب السبب'); return; }
          await Store.add('delete_invoice', 'del-' + d.id, day, 'حذف ' + d.title, 0, { id: d.id, reason });
          const e = await Sync.run(true); toast(e || 'حُذفت الفاتورة'); fill();
        })]);
      choose(d.title, acts.map(a => a[0]), i => acts[i][1]());
      return;
    }
    if (d.kind === 'collection') {
      const p = d.local ? d.json : Object.assign(JSON.parse(JSON.stringify(d.json)), { day });
      const acts = [['👁 عرض التفاصيل', () => showVoucher(d, p)], ['🖨 إعادة طباعة', async () => { await logoReady; printSlip(Docs.voucher(mm, p), null, 'voucher-' + str(p, 'number')); }]];
      if (canEdit('السماح بتعديل سند قبض')) {
        acts.push(['✏ تعديل السند (المبلغ / نوع التسديد)', () => Nav.go('/collection?edit=' + d.id + '&day=' + day)]);
        acts.push(['🗑 حذف السند', () => ask('حذف السند', 'سبب الحذف (مطلوب)', 'text', '', async reason => {
          if (!reason) { toast('اكتب السبب'); return; }
          await Store.add('delete_collection', 'delc-' + d.id, day, 'حذف ' + d.title, 0, { id: d.id, reason });
          const e = await Sync.run(true); toast(e || 'حُذف السند'); fill();
        })]);
      }
      choose(d.title, acts.map(a => a[0]), i => acts[i][1]());
    }
  }
  /** the invoice as a readable sheet: who, what, how much, what was paid */
  function showInvoice(d, p) {
    const box = ui.vbox(); const tot = Docs.invoiceTotal(p);
    const kv = (k, v, strong) => { const r = ui.hbox(); r.style.padding = '3px 0'; r.append(grow(ui.text(k, 13.5, false, C.muted))); const t = ui.text(v, 14, !!strong); t.dir = 'auto'; r.append(t); return r; };
    box.append(kv('العميل', str(p, 'customer_name'), true), kv('النوع', str(p, 'receipt_type')), kv('التاريخ', Fmt.pretty(str(p, 'day') || day) + (str(p, 'time') ? ' ' + str(p, 'time') : '')));
    box.append(ui.section('الأصناف'));
    for (const l of (p.lines || [])) {
      const r = ui.hbox(); r.style.padding = '5px 0'; r.style.borderBottom = '1px solid ' + C.line;
      r.append(grow(ui.text(str(l, 'item'), 14.5, true)));
      const a = ui.text(Fmt.kg(num(l.qty)) + ' × ' + Fmt.money3(num(l.price)) + ' = ' + Fmt.money(Fmt.round2(num(l.qty) * num(l.price))), 13.5); a.dir = 'ltr'; r.append(a);
      box.append(r);
    }
    box.append(kv('الاجمالي', Fmt.money(tot) + ' د.ا', true));
    if (p.paid != null) box.append(kv('المدفوع', Fmt.money(num(p.paid)) + ' د.ا'), kv('المتبقي على الفاتورة', Fmt.money(Fmt.round2(tot - num(p.paid))) + ' د.ا'));
    if (d.edited) box.append(ui.text('✏ عُدّلت من هذا الهاتف' + (d.status === Store.PENDING ? ' — لم يُرسل التعديل بعد' : ''), 12.5, true, C.warn));
    if (d.deleted) box.append(ui.text('🗑 محذوفة', 12.5, true, C.bad));
    Dlg.show({ title: 'فاتورة ' + str(p, 'number'), content: box, buttons: [{ label: 'إغلاق', role: 'pos' }] });
  }
  function showVoucher(d, p) {
    const box = ui.vbox();
    const kv = (k, v, strong) => { const r = ui.hbox(); r.style.padding = '4px 0'; r.append(grow(ui.text(k, 13.5, false, C.muted))); const t = ui.text(v, 14.5, !!strong); t.dir = 'auto'; r.append(t); return r; };
    box.append(kv('العميل', str(p, 'customer_name'), true), kv('المبلغ', Fmt.money(num(p.amount)) + ' د.ا', true), kv('نوع التسديد', str(p, 'method')), kv('التاريخ', Fmt.pretty(str(p, 'day') || day)));
    if (str(p, 'invoice_number')) box.append(kv('عن فاتورة', str(p, 'invoice_number')));
    if (str(p, 'cheque_no')) box.append(kv('رقم الشيك', str(p, 'cheque_no')), kv('الاستحقاق', Fmt.pretty(str(p, 'due_on'))), kv('حالة الشيك', str(p, 'cheque_status') || 'برسم التحصيل'));
    if (str(p, 'note')) box.append(kv('ملاحظة', str(p, 'note')));
    if (d.edited) box.append(ui.text('✏ عُدّل من هذا الهاتف' + (d.status === Store.PENDING ? ' — لم يُرسل التعديل بعد' : ''), 12.5, true, C.warn));
    if (d.deleted) box.append(ui.text('🗑 محذوف', 12.5, true, C.bad));
    Dlg.show({ title: 'سند قبض ' + (str(p, 'number') || ''), content: box, buttons: [{ label: 'إغلاق', role: 'pos' }] });
  }
  const serverInvoice = j => serverInvoiceOf(j, day);
  fill();
};
/** a database invoice in the shape the slip and the forms use (the payment taken with it comes from the day's collections) */
function serverInvoiceOf(j, day) {
  {
    const p = Object.assign(JSON.parse(JSON.stringify(j)), { day, lines: j.lines || [] });
    const mm = Master.load(); const c = mm ? mm.customer(num(j.customer_id)) : null;
    if (c) p.customer_number = c.number;
    if (str(j, 'receipt_type') === 'نقدي') p.paid = num(j.total);
    else {
      // the payment taken with the sale is a collection carrying the invoice number and no voucher number
      const n = str(j, 'number'); let paid = 0;
      const dd = DayData.load(day); const cols = dd ? dd.arr('collections') : [];
      if (n) for (const c2 of cols) if (str(c2, 'invoice_number') === n && !str(c2, 'number') && c2.deleted !== true) paid += num(c2.amount);
      p.paid = paid;
    }
    return p;
  }
}

/** The van's bank position: what came in, what went to the bank, what is still outside. */

// ------------------------------------------------------------------ مخزون السيارة / الجرد الفعلي
/** The van's stock today (from the database) and الجرد الفعلي (mode = count). */
Screens.stock = function (mode) {
  const counting = mode === 'count';
  const mm = Master.load();
  const S = screen(counting ? 'الجرد الفعلي' : 'مخزون السيارة');
  if (counting && !(mm && mm.allowed('السماح بإدخال الجرد الفعلي', false))) { toastLong('إدخال الجرد غير مسموح لهذه السيارة'); Nav.finish(); return; }
  const inputs = new Map();
  const refetch = async (always) => {
    try { await Sync.fetchDay(Fmt.today()); }
    catch (e) { if (e instanceof ApiError && e.sessionEnded) { Sync.sessionEnded = true; Sync.afterRun(); return; } if (always) toast(errText(e)); }
    if (!S.live()) return;
    if (always || ![...inputs.values()].some(i => i.value)) draw();
  };
  S.barAction('⟳', () => refetch(true));
  function draw() {
    const body = S.body; body.innerHTML = ''; inputs.clear();
    const d = DayData.load(Fmt.today());
    const rows = d ? d.arr('stock') : [];
    const pendingSales = Store.pending().filter(o => o.kind === 'invoice').length;
    if (pendingSales > 0) body.append(ui.banner('⏳ ' + pendingSales + ' فاتورة لم تُرسل بعد — الأرقام لا تشملها', C.warn, C.warnSoft));
    if (counting) { const t = ui.text('اكتب الكمية الموجودة فعلاً في السيارة لكل صنف عددته. اترك الباقي فارغاً.', 14, false, C.muted); t.style.paddingBottom = '8px'; body.append(t); }
    const names = [];
    for (const r of rows) if (!names.includes(str(r, 'item'))) names.push(str(r, 'item'));
    if (counting && mm) mm.items.forEach(i => { if (!names.includes(i.name)) names.push(i.name); });
    if (!names.length) { body.append(ui.text('لا حركة مخزون اليوم بعد', 15, false, C.muted, true)); S.hideFooter(); return; }
    for (const n of names) {
      let r = null; for (const x of rows) if (str(x, 'item') === n) r = x;
      const c = ui.card(); c.style.padding = '8px 12px';
      const top = ui.hbox();
      top.append(grow(ui.text(n, 16, true)));
      const book = r ? num(r.book) : 0;
      top.append(ui.text(Fmt.kg(book) + ' كغم', 16, true, book < 0 ? C.bad : C.primary));
      c.append(top);
      if (r) c.append(ui.text('بداية ' + Fmt.kg(num(r.opening)) + ' + مشتريات ' + Fmt.kg(num(r.purchases)) + ' + وارد ' + Fmt.kg(num(r.transfer_in)) + ' − صادر ' + Fmt.kg(num(r.transfer_out)) + ' − مبيعات ' + Fmt.kg(num(r.sold)), 12.5, false, C.muted));
      if (r && r.counted != null) {
        const diff = num(r.diff);
        c.append(ui.text('الجرد: ' + Fmt.kg(num(r.counted)) + ' · ' + (diff > 0.05 ? 'نقص ' + Fmt.kg(diff) : diff < -0.05 ? 'زيادة ' + Fmt.kg(-diff) : 'مطابق'), 13, true, Math.abs(diff) > 0.05 ? C.warn : C.ok));
      }
      if (counting) {
        const [fb, e] = ui.field('الموجود فعلاً (كغم)', r && r.counted != null ? Fmt.kg(num(r.counted)) : '', 'number');
        e.dataset.item = n; inputs.set(n, e); c.append(fb);
      }
      body.append(c);
    }
    if (counting) { const sb = ui.button('حفظ الجرد', 0, saveCount); sb.id = 'count-save'; S.showFooter(sb); }
  }
  let savedCount = false;
  async function saveCount() {
    if (savedCount) return;
    const items = [];
    for (const [n, e] of inputs) { const q = Fmt.parse(e.value); if (q === null) continue; items.push({ item: n, qty: q }); }
    if (!items.length) { toast('لم تُكتب أي كمية'); return; }
    savedCount = true; S.hideFooter();
    const day = Fmt.today();
    await Store.add('count', 'count-' + day + '-' + Date.now(), day, 'جرد ' + items.length + ' صنف', 0, { day, items });
    Sync.run(false);
    toast('حُفظ الجرد ✓'); Nav.finish();
  }
  draw();
  refetch(false);
};

  const mm = Master.load();

    const S = screen('سجل التحويلات');

      if (!S.live()) return;
      const body = S.body; body.innerHTML = '';
      const pend = [...Store.pending().filter(o => o.kind === 'transfer'), ...Store.failed().filter(o => o.kind === 'transfer')];
      for (const o of pend) {
        const c = ui.card(C.warnSoft, C.line);
        c.append(ui.text(str(o.payload, 'item') + ' · ' + Fmt.kg(num(o.payload.qty)) + ' كغم', 16, true));

      let lastDay = '';
      for (const t of rows) {
        const d = str(t, 'day');

        const incoming = str(t, 'direction') === 'وارد';

        top.append(ui.pill(str(t, 'direction'), incoming ? C.ok : C.bad, incoming ? C.okSoft : C.badSoft));

        top.append(ui.text(Fmt.kg(num(t.qty)) + ' كغم', 16, true, C.primary));
        c.append(top);
        c.append(ui.text((incoming ? 'من ' : 'إلى ') + str(t, 'other_side') + (t.unit_cost != null ? ' · كلفة ' + Fmt.money3(num(t.unit_cost)) : '') + (str(t, 'note').trim() ? ' · ' + str(t, 'note') : ''), 13, false, C.muted));
        body.append(c);

    };
    const refreshLog = async () => {
      try { await Sync.fetchDay(Fmt.today()); } catch (e) { if (e instanceof ApiError && e.sessionEnded) { Sync.sessionEnded = true; Sync.afterRun(); return; } toast(errText(e)); }
      drawLog();
    };
    S.barAction('⟳', refreshLog);
    drawLog(); refreshLog();
    return;
  }
  const S = screen('تحويلات جديدة'); const body = S.body;
  if (!mm.allowed('السماح بتحويلات بين الفروع', true)) { toastLong('التحويلات غير مسموحة لهذه السيارة'); Nav.finish(); return; }
  let day = Fmt.today();
  if (mm.allowed('اختيار التاريخ للتحويلات', false)) {
    const [db, dv] = ui.chooser('التاريخ', Fmt.pretty(day), () => pickDay(day, mm.intSetting('عدد الأيام المسموح الرجوع لها', 3), d => { day = d; dv.setValue(Fmt.pretty(d)); }));
    body.append(db);
  }
  const other = mm.allowed('السماح بالتحويل باسم سيارة أخرى', false);
  const names = mm.places.map(p => p.name);
  const linesBox = ui.vbox(); linesBox.id = 'tr-lines'; body.append(linesBox);
  const lines = []; // {item, from, to, qty(EditText), card}
  const count = () => { const k = lines.filter(l => l.item && l.to && Fmt.parse(l.qty.value) > 0).length; hint.textContent = k ? k + ' تحويل جاهز' : 'اختر الصنف والجهة والكمية — يُفتح سطر جديد تلقائياً'; };
  function addLine() {
    const l = { item: '', from: lines.length ? lines[lines.length - 1].from : mm.myPlace, to: lines.length ? lines[lines.length - 1].to : '', qty: null, card: null };
    const c = ui.card(); c.classList.add('tr-line'); c.style.padding = '10px 12px';
    const head = ui.hbox(); head.append(grow(ui.text('تحويل ' + (lines.length + 1), 13, true, C.muted)));
    const del = ui.text('✕', 15, true, C.bad); del.style.padding = '2px 8px'; del.classList.add('click'); del.setAttribute('aria-label', 'حذف السطر');
    del.onclick = () => { if (lines.length > 1) { lines.splice(lines.indexOf(l), 1); c.remove(); lines.forEach((x, i) => x.card.querySelector('.tr-no').textContent = 'تحويل ' + (i + 1)); count(); } };
    head.firstChild.classList.add('tr-no'); head.append(del); c.append(head);
    const [ib, itemView] = ui.chooser('الصنف', '', () => choose('الصنف', mm.items.map(i => i.name), i => { l.item = mm.items[i].name; itemView.setValue(l.item); maybeNext(l); })); itemView.classList.add('tr-item');
    const [fb, fromView] = ui.chooser('من', l.from, () => choose('من', names, i => { l.from = names[i]; fromView.setValue(l.from); warn(l); })); fromView.classList.add('tr-from');
    const [tb, toView] = ui.chooser('إلى', l.to, () => choose('إلى', names, i => { l.to = names[i]; toView.setValue(l.to); warn(l); maybeNext(l); })); toView.classList.add('tr-to');
    const [qb, qty] = ui.field('الكمية (كغم)', '', 'number'); qty.classList.add('tr-qty'); l.qty = qty;
    qty.addEventListener('input', () => { count(); }); qty.addEventListener('change', () => maybeNext(l));
    c.append(ib, fb, tb, qb); l.card = c; lines.push(l); linesBox.append(c); count();
  }
  const warn = l => { if (!other && l.from && l.to && l.from !== mm.myPlace && l.to !== mm.myPlace) toast('يجب أن يكون التحويل من سيارتك (' + mm.myPlace + ') أو إليها'); };
  // the last line filled → open another one
  const maybeNext = l => { if (l === lines[lines.length - 1] && l.item && l.to && Fmt.parse(l.qty.value) > 0) addLine(); count(); };
  const hint = ui.text('', 13, false, C.muted); hint.style.padding = '4px 2px';
  body.append(hint);
  const addBtn = ui.button('+ سطر إضافي', 3, addLine); addBtn.id = 'tr-add'; body.append(addBtn);
  const [nb, note] = ui.field('ملاحظة (اختياري)'); body.append(nb);
  body.append(ui.text('الكلفة تُحسب في المكتب تلقائياً.', 13, false, C.muted));
  addLine();
  let saving = false;
  const sb = ui.button('حفظ التحويلات', 0, () => {
    if (saving) return;
    const ready = [];
    for (const l of lines) {
      const q = Fmt.parse(l.qty.value);
      if (!l.item && (q === null || q <= 0)) continue; // the spare line (it only carries من/إلى copied from above)
      if (!l.item) { toast('اختر الصنف في كل سطر'); return; }
      if (!l.from || !l.to) { toast('اختر من وإلى في كل سطر'); return; }
      if (l.from === l.to) { toast('«من» و«إلى» متشابهان في ' + l.item); return; }
      if (q === null || q <= 0) { toast('اكتب الكمية لـ ' + l.item); return; }
      if (!other && l.from !== mm.myPlace && l.to !== mm.myPlace) { toast('يجب أن يكون التحويل من سيارتك أو إليها'); return; }
      ready.push({ item: l.item, from: l.from, to: l.to, qty: q });
    }
    if (!ready.length) { toast('أضف تحويلاً واحداً على الأقل'); return; }
    const msg = ready.map(r => r.item + ' · ' + Fmt.kg(r.qty) + ' كغم · ' + r.from + ' ← ' + r.to).join('\n');
    confirmDlg('تأكيد ' + ready.length + ' تحويل', msg, 'حفظ', async () => {
      if (saving) return; saving = true;
      for (const r of ready) {
        const id = Fmt.uuid(); const it = mm.item(r.item);
        const p = { id, day, item: r.item, item_id: it ? it.id : null, from: r.from, to: r.to, qty: r.qty, note: note.value.trim() };
        await Store.add('transfer', id, day, r.item + ' · ' + r.from + ' ← ' + r.to, 0, p);
      }
      Sync.run(false);
      toast('حُفظ ' + ready.length + ' تحويل ✓'); Nav.finish();
    });
  });
  sb.id = 'tr-save'; S.showFooter(sb);
};

// ------------------------------------------------------------------ تقرير اليوم
/** One day's report for this van: sales, collections, purchases, money, stock — on screen and on paper. */
Screens.report = function () {
  let day = Fmt.today();
  const S = screen('تقرير اليوم');
  S.barAction('📅', () => pickDay(day, 60, d => { day = d; load(); }));
  S.barAction('⟳', () => load());
  const pb = ui.button('🖨 طباعة التقرير', 0, async () => { await logoReady; printSlip(slip(), null, 'report-' + day); }); pb.id = 'report-print';
  S.showFooter(pb);
  async function load() {
    S.setTitle('تقرير ' + Fmt.pretty(day));
    try { await Sync.fetchDay(day); } catch (e) { if (e instanceof ApiError && e.sessionEnded) { Sync.sessionEnded = true; Sync.afterRun(); return; } toast(errText(e)); }
    draw();
  }
  function figures() {
    const s = new Summary(day); const f = [];
    const sum = l => l.reduce((a, d) => a + d.amount, 0);
    const group = (l, key) => { const mp = new Map(); for (const d of l) { const k = key(d); if (!mp.has(k)) mp.set(k, []); mp.get(k).push(d); } return [...mp]; };
    const inv = s.docs('invoice').filter(d => !d.deleted);
    f.push({ title: 'المبيعات', rows: [['عدد الفواتير', String(inv.length)], ...group(inv, d => str(d.json, 'receipt_type') || 'غير محدد').map(([k, v]) => [k, Fmt.money(sum(v))]), ['الإجمالي', Fmt.money(sum(inv))]] });
    const col = s.docs('collection').filter(d => !d.deleted);
    f.push({ title: 'التسديدات', rows: [...group(col, d => str(d.json, 'method')).map(([k, v]) => [k, Fmt.money(sum(v))]), ['الإجمالي', Fmt.money(sum(col))]] });
    const pur = s.docs('purchase');
    f.push({ title: 'المشتريات', rows: [...pur.map(d => [d.title, Fmt.money(d.amount)]), ['الإجمالي', Fmt.money(sum(pur))]] });
    const ex = s.docs('expense'), dep = s.docs('deposit');
    f.push({ title: 'المصاريف والإيداع', rows: [...ex.map(d => ['مصروف: ' + d.title, Fmt.money(d.amount)]), ...dep.map(d => [d.title, Fmt.money(d.amount)]),
      ['غير مودع', Fmt.money(day === Fmt.today() ? s.undeposited : num(s.dayData && s.dayData.bank ? s.dayData.bank.undeposited : 0))]] });
    const st = s.dayData ? s.dayData.arr('stock') : [];
    if (st.length) f.push({ title: 'المخزون (دفتري)', rows: st.map(j => [str(j, 'item'), Fmt.kg(num(j.book)) + (j.counted != null ? ' / جرد ' + Fmt.kg(num(j.counted)) : '')]) });
    return f;
  }
  function draw() {
    if (!S.live()) return;
    const body = S.body; body.innerHTML = '';
    if (DayData.load(day) === null && !Store.ofDay(day).length) { body.append(ui.text('لا بيانات لهذا اليوم على الهاتف — اضغط ⟳', 15, false, C.muted, true)); return; }
    if (Store.ofDay(day).some(o => o.status !== Store.SENT)) body.append(ui.banner('⏳ يشمل مستندات لم تُرسل بعد', C.warn, C.warnSoft));
    for (const fg of figures()) {
      const c = ui.card();
      c.append(ui.text(fg.title, 16, true, C.primary));
      if (fg.rows.length <= 1 && fg.rows[0] && fg.rows[0][1] === Fmt.money(0)) { c.append(ui.text('لا يوجد', 14, false, C.muted)); body.append(c); continue; }
      fg.rows.forEach(([k, v], i) => c.append(ui.row(k, v, i === fg.rows.length - 1 && fg.title !== 'المخزون (دفتري)')));
      body.append(c);
    }
  }
  function slip() {
    const s = new Slip(Prefs.paperDots, Prefs.printLogo);
    s.header('تقرير يومي');
    s.pair('السيارة', Prefs.vanName).pair('التاريخ', Fmt.dayName(day) + ' ' + Fmt.pretty(day)).pair('وقت الطباعة', Fmt.stamp(), s.small, s.small);
    for (const fg of figures()) { s.divider(false).center(fg.title, s.bold); fg.rows.forEach(([k, v]) => s.pair(k, v, s.small, s.small)); }
    s.space(8).signature('توقيع السائق');
    return s.bitmap('');
  }
  draw(); load();
};

// ------------------------------------------------------------------ الإعدادات
/** This phone's own settings: paper, reminder time, text size; sync and sign-out. */
Screens.settings = function () {
  const S = screen('الإعدادات');
  function draw() {
    if (!S.live()) return;
    const body = S.body; body.innerHTML = '';
    const acc = ui.card();
    acc.append(ui.text('السيارة', 13, false, C.muted));
    acc.append(ui.text(Prefs.vanName + '  (رقم ' + Prefs.vanNo + ')', 18, true));
    const ls = Prefs.lastSync ? new Date(Prefs.lastSync) : null;
    acc.append(ui.row('آخر مزامنة', ls ? ls.getFullYear() + '/' + p2(ls.getMonth() + 1) + '/' + p2(ls.getDate()) + ' ' + p2(ls.getHours()) + ':' + p2(ls.getMinutes()) : '—', false, C.text, 14));
    acc.append(ui.row('لم يُرسل بعد', String(Store.unsentCount()), false, C.text, 14));
    acc.append(ui.row('أرقام فواتير محجوزة', String(Store.freeNumbers('invoice')), false, C.text, 14));
    acc.append(ui.row('أرقام سندات محجوزة', String(Store.freeNumbers('voucher')), false, C.text, 14));
    if (Prefs.lastError) acc.append(ui.text('آخر خطأ: ' + Prefs.lastError, 13, false, C.bad));
    body.append(acc);
    body.append(ui.button('⟳ مزامنة الآن', 0, () => { toast('جارٍ المزامنة…'); Sync.run(true).then(e => { toast(e || 'تمت المزامنة ✓'); draw(); }); }));
    body.append(ui.button('📤 ما لم يُرسل', 1, () => Nav.go('/list/unsent')));

    body.append(ui.section('الطابعة'));
    const pr = ui.card();
    pr.append(ui.row('الطابعة', 'من الهاتف: مشاركة أو طباعة', true));
    pr.append(ui.text('حجم الورق', 13, false, C.muted));
    pr.append(ui.segments(['58 مم', '80 مم'], Prefs.paperMm >= 80 ? 1 : 0, i => { Prefs.paperMm = i === 1 ? 80 : 58; }));
    pr.append(ui.toggle('الشعار على الورق', Prefs.printLogo, v => { Prefs.printLogo = v; }));
    body.append(pr);
    body.append(ui.button('🧪 طباعة تجربة', 1, async () => {
      await logoReady;
      const s = new Slip(Prefs.paperDots, Prefs.printLogo);
      s.header('تجربة طباعة').pair('السيارة', Prefs.vanName).pair('الورق', Prefs.paperMm + ' مم').pair('الإصدار', Config.VERSION);
      s.table(['الصنف', 'كغم', 'السعر', 'القيمة'], [['صدر دجاج', '12.5', '3.10', '38.75']], [0.24, 0.17, 0.17]);
      s.box('الاجمالي', '38.75');
      printSlip(s.bitmap(), null, 'test');
    }));

    body.append(ui.section('التذكير اليومي', 'يذكّر بصور المشتريات والمصاريف والإيداع إن وُجد نقص'));
    const rc = ui.card();
    rc.append(ui.row('الساعة', p2(Prefs.reminderHour < 0 ? 0 : Prefs.reminderHour) + ':00', true));
    const hourIdx = { '-1': 0, '17': 1, '21': 3 }[String(Prefs.reminderHour)] ?? 2;
    rc.append(ui.segments(['لا تذكير', '17:00', '19:00', '21:00'], hourIdx, i => {
      Prefs.reminderHour = [-1, 17, 19, 21][i];
      try { if (i > 0 && 'Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {}); } catch (e) {}
      draw();
    }));
    rc.append(ui.text('على الآيفون يظهر التذكير في الشاشة الرئيسية بعد هذه الساعة.', 12, false, C.muted));
    body.append(rc);

    body.append(ui.section('العرض'));
    const dc = ui.card();
    dc.append(ui.toggle('خط كبير', Prefs.bigText, v => { Prefs.bigText = v; toast('يظهر عند فتح الشاشات من جديد'); }));
    body.append(dc);

    body.append(ui.section('الحساب'));
    const lo = ui.button('🚪 تسجيل الخروج', 2, logout); lo.id = 'logout'; body.append(lo);
    const v = ui.text('كاش فان ' + Config.VERSION + ' · ' + Config.COMPANY, 12, false, C.muted, true); v.style.padding = '16px 0 8px'; body.append(v);
  }
  function logout() {
    const n = Store.unsentCount();
    const msg = n > 0 ? 'على الهاتف ' + n + ' مستند لم يُرسل بعد. سيبقى محفوظاً ويُرسل عند الدخول مرة أخرى بنفس السيارة.\n\nتسجيل الخروج؟' : 'تسجيل الخروج من هذا الهاتف؟';
    confirmDlg('تسجيل الخروج', msg, 'خروج', async () => {
      const tok = Prefs.token;
      try { await Api.call('app_logout', { p_token: tok }); } catch (e) {}
      Prefs.signOut(); goLogin();
    });
  }
  draw();
};

// ------------------------------------------------------------------ start
(async function boot() {
  Prefs.load();
  applyScale();
  if (history.state && history.state.dlg) history.replaceState({ d: history.state.d || 0 }, '', location.href);
  await Store.open();
  try { await Store.purgeDrafts(); } catch (e) {}
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
  await Promise.race([logoReady, new Promise(r => setTimeout(r, 1500))]);
  if (!location.hash) history.replaceState({ d: 0 }, '', '#/home');
  else if (!history.state) history.replaceState({ d: 0 }, '', location.href);
  Nav.render();
  // like the Android app's onResume: coming back to the main screen refreshes it
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Prefs.signedIn && /^#\/home/.test(location.hash) && !Dlg.stack.length) Nav.render();
  });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    if (document.readyState === 'complete') navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
})();
</script>
